[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-harness"
version = "0.1.2"
license = "MIT"
license-files = ["LICENSE"]
description = "Deterministic, evidence-led pull request review harness"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
pr-review = "pr_review_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pr_review_harness = ["contract_registry.json"]

[project.optional-dependencies]
github-app = ["PyJWT[crypto]>=2.10,<3"]
# Development/test tools. Runtime dependencies stay empty; see docs/PUBLIC-API.md
# and tests/test_dependency_supply_chain.py. `uv` is pinned so lock generation
# and the scheduled `uv audit` scan run with the exact reviewed generator
# version recorded in requirements-dev.lock.
dev = ["build>=1.2,<2", "pytest>=8", "pytest-cov>=5,<8", "ruff>=0.9", "mypy==1.15.0", "setuptools>=77", "PyJWT[crypto]>=2.10,<3", "PyYAML>=6,<7", "jsonschema>=4.18,<5", "uv==0.13.6"]

[tool.uv]
# The lock is generated by exactly this uv release. scripts/check_dev_lock.py
# verifies with `uv lock --check` and an export diff. Bump this and `uv` in the
# dev extra together in one reviewed change, then regenerate the lock and export.
required-version = "==0.13.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "compatibility: historical compatibility checks against preserved revision pins",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pr_review_harness/typed_contracts.pyi", "src/pr_review_harness/typed_boundary_probe.pyi"]
follow_imports = "silent"
warn_unused_ignores = true

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
precision = 2

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
# `ruff format` is canonical for maintained code. The frozen historical
# compatibility fixtures are sha256-pinned evidence (see
# tests/fixtures/frozen-runtime-7d550b6/pins.json); reformatting them would break
# the VD-3 pins, so they are excluded here rather than migrated silently.
exclude = [
  "tests/fixtures/frozen-runtime-7d550b6/**",
  "tests/fixtures/*-base.py",
]

[tool.mutmut]
paths_to_mutate = ["src/pr_review_harness/reconcile.py"]
also_copy = ["src/pr_review_harness"]
pytest_add_cli_args_test_selection = ["tests/test_reconcile.py"]
