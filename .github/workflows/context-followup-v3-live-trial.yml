name: Bounded context follow-up v3 live provider trial

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-followup-v3-live-trial
  cancel-in-progress: false

jobs:
  trial:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'groktopus/codereview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Start the bounded matrix clock before checkout and setup
        run: |
          python3 - <<'PY'
          import os
          import time

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"TRIAL_STARTED_EPOCH={int(time.time())}\n")
          PY

      - name: Check out the runner at the immutable dispatch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: groktopus/codereview
          ref: ${{ github.sha }}
          path: trusted-runner
          persist-credentials: false

      - name: Verify dispatch source identity
        working-directory: trusted-runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          expected = os.environ.get("EXPECTED_SHA", "")
          if os.environ.get("GITHUB_REPOSITORY") != "groktopus/codereview":
              raise SystemExit("dispatch_repository_invalid")
          if os.environ.get("GITHUB_REF") != "refs/heads/main" or os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
              raise SystemExit("dispatch_context_invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("runner_sha_invalid")
          result = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, timeout=10, check=False)
          if result.returncode or result.stdout.strip() != expected:
              raise SystemExit("runner_revision_mismatch")
          PY

      - name: Check out the fixed v3 runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: groktopus/codereview
          ref: 7c89ad17327b8f0ed4fc381bf5c93255fd4e548e
          path: trusted-runtime
          persist-credentials: false

      - name: Verify fixed runtime source identity
        working-directory: trusted-runtime
        env:
          EXPECTED_RUNTIME_SHA: 7c89ad17327b8f0ed4fc381bf5c93255fd4e548e
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          expected = os.environ.get("EXPECTED_RUNTIME_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("runtime_sha_invalid")
          result = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, timeout=10, check=False)
          if result.returncode or result.stdout.strip() != expected:
              raise SystemExit("runtime_revision_mismatch")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Build and install the exact runtime wheel
        working-directory: trusted-runtime
        id: runtime-wheel
        run: |
          python -m pip install --disable-pip-version-check "build>=1.2,<2"
          python -m build --wheel --outdir "$RUNNER_TEMP/context-followup-v3-wheelhouse" . >/dev/null
          python - <<'PY'
          import hashlib
          import os
          import subprocess
          import sys
          from pathlib import Path

          wheels = list((Path(os.environ["RUNNER_TEMP"]) / "context-followup-v3-wheelhouse").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("pinned_runtime_wheel_count_invalid")
          result = subprocess.run([sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "--no-deps", str(wheels[0])], timeout=180, check=False)
          if result.returncode:
              raise SystemExit("pinned_runtime_install_failed")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write("sha256=" + hashlib.sha256(wheels[0].read_bytes()).hexdigest() + "\n")
          PY

      - name: Run the fixed three-case v3 provider trial
        working-directory: trusted-runner
        env:
          GITHUB_SHA: ${{ github.sha }}
          RUNTIME_WHEEL_SHA256: ${{ steps.runtime-wheel.outputs.sha256 }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
          JEV_MODEL: ${{ secrets.JEV_MODEL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          required = ("LLM_BASE_URL", "LLM_MODEL", "LLM_API_KEY", "JEV_BASE_URL", "JEV_MODEL", "JEV_API_KEY")
          if any(not os.environ.get(name) for name in required):
              raise SystemExit("required_provider_configuration_missing")
          PY
          python3 scripts/run_real_case_trial.py \
            --mode full-three-case --run-provider-trial \
            --input-contract specialist-input-v2-context-followup-v3 \
            --artifacts "$RUNNER_TEMP/historical-real-case-trial-context-followup-v3" \
            --cli "$(command -v pr-review)" --runtime-source "$GITHUB_WORKSPACE/trusted-runtime"

      - name: Remove only private trial workspace data
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "historical-real-case-trial-context-followup-v3"
          try:
              info = path.lstat()
          except FileNotFoundError:
              raise SystemExit(0)
          except OSError:
              raise SystemExit("trial_workspace_cleanup_failed")
          if stat.S_ISLNK(info.st_mode) or not stat.S_ISDIR(info.st_mode):
              raise SystemExit("trial_workspace_cleanup_refused")
          private = path / "private"
          try:
              private_info = private.lstat()
          except FileNotFoundError:
              private_info = None
          except OSError:
              raise SystemExit("trial_workspace_cleanup_failed")
          if private_info is not None:
              if stat.S_ISLNK(private_info.st_mode) or not stat.S_ISDIR(private_info.st_mode):
                  raise SystemExit("trial_workspace_cleanup_refused")
              shutil.rmtree(private)
          PY

      - name: Upload only the sanitized summary and manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: context-followup-v3-live-trial-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/historical-real-case-trial-context-followup-v3/summary.json
            ${{ runner.temp }}/historical-real-case-trial-context-followup-v3/manifest.json
          if-no-files-found: warn
          retention-days: 7
