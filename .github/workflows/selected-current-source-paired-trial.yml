name: Selected current-source synthetic paired trial

on:
  workflow_dispatch:
    inputs:
      run_live_trial:
        description: Run the fixed three-case trial with the configured providers after provider-free preparation
        type: boolean
        required: true
        default: false
      trial_version:
        description: Versioned fixed synthetic trial contract; v2 adds required native Jev claim reconciliation
        type: choice
        required: true
        default: v1
        options:
          - v1
          - v2

permissions:
  contents: read

concurrency:
  group: selected-current-source-paired-trial
  cancel-in-progress: false

jobs:
  trial:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'groktopus/codereview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the exact current dispatch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify repository, main ref, and checked-out revision
        env:
          EXPECTED_REPOSITORY: groktopus/codereview
          ACTUAL_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: refs/heads/main
          ACTUAL_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          if os.environ.get("ACTUAL_REPOSITORY") != os.environ.get("EXPECTED_REPOSITORY"):
              raise SystemExit("trusted_repository_mismatch")
          if os.environ.get("ACTUAL_REF") != os.environ.get("EXPECTED_REF"):
              raise SystemExit("trusted_ref_mismatch")
          expected = os.environ.get("EXPECTED_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("trusted_revision_invalid")
          try:
              result = subprocess.run(
                  ["git", "rev-parse", "HEAD"], check=False, capture_output=True,
                  text=True, timeout=10,
              )
          except (OSError, subprocess.TimeoutExpired):
              raise SystemExit("trusted_revision_unavailable") from None
          if result.returncode or result.stdout.strip() != expected:
              raise SystemExit("trusted_revision_mismatch")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Build and install the wheel from this source revision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selected-current-wheelhouse"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/selected-current-wheelhouse" .
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          wheels = list(Path(os.environ["RUNNER_TEMP"], "selected-current-wheelhouse").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("trusted_wheel_count_invalid")
          try:
              result = subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--no-deps", str(wheels[0])],
                  check=False, timeout=180,
              )
          except (OSError, subprocess.TimeoutExpired):
              raise SystemExit("trusted_wheel_install_failed") from None
          if result.returncode:
              raise SystemExit("trusted_wheel_install_failed")
          PY

      - name: Preflight the bounded effect observer before preparation
        env:
          OBSERVER_SOURCE: ${{ github.workspace }}/src/pr_review_harness/external_effect_observer.py
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from pr_review_harness.external_effect_observer import OBSERVER_ID

          try:
              source_hash = hashlib.sha256(Path(os.environ["OBSERVER_SOURCE"]).read_bytes()).hexdigest()
              result = subprocess.run(
                  [sys.executable, "-m", "pr_review_harness.external_effect_observer"],
                  check=False, capture_output=True, text=True, timeout=20,
              )
              identity = json.loads(result.stdout)
          except (OSError, subprocess.TimeoutExpired, json.JSONDecodeError):
              raise SystemExit("effect_observer_preflight_unavailable") from None
          if (
              result.returncode
              or identity.get("status") != "AVAILABLE"
              or OBSERVER_ID != "linux-strace-syscall-observer.v3"
              or identity.get("source_sha256") != source_hash
              or identity.get("kill_on_exit_supported") is not True
          ):
              raise SystemExit("effect_observer_preflight_rejected")
          print(json.dumps({
              "status": identity.get("status"),
              "observer_id": OBSERVER_ID,
              "source_sha256": source_hash,
              "kill_on_exit_supported": True,
          }, sort_keys=True, separators=(",", ":")))
          PY

      - name: Prepare and validate the exact current-source requests without credentials
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          PREPARATION_OUTPUT: ${{ runner.temp }}/selected-current-source-trial
          TRIAL_VERSION: ${{ inputs.trial_version }}
        run: |
          set -euo pipefail
          python scripts/run_current_selected_model_trial.py \
            --prepare-only \
            --trial-version "$TRIAL_VERSION" \
            --expected-source-revision "$EXPECTED_SOURCE_REVISION" \
            --output "$PREPARATION_OUTPUT" \
            --cli-executable "$(command -v pr-review)" >/dev/null

      - name: Run the selected current-source trial with private temporary configs
        if: inputs.run_live_trial == true
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
          JEV_MODEL: ${{ secrets.JEV_MODEL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          PREPARATION_OUTPUT: ${{ runner.temp }}/selected-current-source-trial
          TRIAL_VERSION: ${{ inputs.trial_version }}
          RESULT_OUTPUT: ${{ runner.temp }}/selected-current-source-result
          CONFIG_OUTPUT: ${{ runner.temp }}/selected-current-source-provider-config
        run: |
          set -euo pipefail
          python scripts/provider_config_from_env.py --output-dir "$CONFIG_OUTPUT" --json >/dev/null
          python scripts/run_current_selected_model_trial.py \
            --run-provider-trial \
            --trial-version "$TRIAL_VERSION" \
            --expected-source-revision "$EXPECTED_SOURCE_REVISION" \
            --preparation-dir "$PREPARATION_OUTPUT" \
            --output "$RESULT_OUTPUT" \
            --cli-executable "$(command -v pr-review)" \
            --provider-config "$CONFIG_OUTPUT/provider.json" \
            --decision-config "$CONFIG_OUTPUT/decision.json" \
            --observe-effects >/dev/null

      - name: Remove only the private provider configs
        if: always()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          path = root / "selected-current-source-provider-config"
          try:
              metadata = path.lstat()
          except FileNotFoundError:
              metadata = None
          except OSError:
              raise SystemExit("private_trial_cleanup_failed") from None
          if metadata is not None:
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                  raise SystemExit("private_trial_cleanup_failed")
              try:
                  path.resolve(strict=True).relative_to(root)
                  shutil.rmtree(path)
              except (OSError, ValueError):
                  raise SystemExit("private_trial_cleanup_failed") from None
          PY

      - name: Upload only versioned sanitized trial receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selected-current-source-paired-trial-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/selected-current-source-trial/manifest.json
            ${{ runner.temp }}/selected-current-source-trial/summary.json
            ${{ runner.temp }}/selected-current-source-result/manifest.json
            ${{ runner.temp }}/selected-current-source-result/summary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove local preparation files after upload
        if: always()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          path = root / "selected-current-source-trial"
          try:
              metadata = path.lstat()
          except FileNotFoundError:
              metadata = None
          except OSError:
              raise SystemExit("preparation_cleanup_failed") from None
          if metadata is not None:
              if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISDIR(metadata.st_mode):
                  raise SystemExit("preparation_cleanup_failed")
              try:
                  path.resolve(strict=True).relative_to(root)
                  shutil.rmtree(path)
              except (OSError, ValueError):
                  raise SystemExit("preparation_cleanup_failed") from None
          PY
