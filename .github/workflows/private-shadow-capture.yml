name: Model-only shadow trial preparation

on:
  workflow_dispatch:
    inputs:
      run_live_writer:
        description: Run the separately bounded writer-only shadow capture after fresh preflight
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: private-shadow-capture
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'groktopus/codereview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Start the bounded preparation clock
        id: trial-start
        run: |
          python3 - <<'PY'
          import os
          import time
          from pathlib import Path

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"started_epoch={int(time.time())}\n")
          PY

      - name: Check out the trusted runner at the dispatch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: groktopus/codereview
          ref: ${{ github.sha }}
          path: trusted-runner
          persist-credentials: false

      - name: Verify the trusted runner identity
        working-directory: trusted-runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          expected = os.environ.get("EXPECTED_SHA", "")
          if os.environ.get("GITHUB_REPOSITORY") != "groktopus/codereview":
              raise SystemExit("dispatch_repository_invalid")
          if os.environ.get("GITHUB_REF") != "refs/heads/main" or os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
              raise SystemExit("dispatch_context_invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("runner_sha_invalid")
          result = subprocess.run(["git", "rev-parse", "HEAD"], check=False,
                                  capture_output=True, text=True, timeout=10)
          if result.returncode or result.stdout.strip() != expected:
              raise SystemExit("runner_revision_mismatch")
          PY

      - name: Select the pinned frozen PR-464 input contract
        id: runtime-pin
        run: |
          set -euo pipefail
          {
            echo 'runtime_sha=5873c3f1b297a96c49b78cbcb7be674ab70b3cea'
            echo 'runtime_inventory_sha256=1c94fabdbd5419a2da5beeed1e6d72030af2af71531f3a58defe1bf0a34ff9c0'
            echo 'contract=specialist-input-v2'
          } >> "$GITHUB_OUTPUT"

      - name: Check out the exact frozen preparation runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: groktopus/codereview
          ref: ${{ steps.runtime-pin.outputs.runtime_sha }}
          path: trusted-runtime
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Build and install the pinned runtime wheel
        id: runtime-wheel
        working-directory: trusted-runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'build>=1.2,<2'
          mkdir -m 700 -p "$RUNNER_TEMP/private-shadow-wheelhouse"
          python -m build --wheel --outdir "$RUNNER_TEMP/private-shadow-wheelhouse" . >/dev/null
          python - <<'PY'
          import hashlib
          import os
          import subprocess
          import sys
          from pathlib import Path

          wheelhouse = Path(os.environ["RUNNER_TEMP"]) / "private-shadow-wheelhouse"
          wheels = list(wheelhouse.glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("pinned_runtime_wheel_count_invalid")
          source = Path(os.environ["GITHUB_WORKSPACE"]) / "trusted-runtime" / "src" / "pr_review_harness"
          modules = {f"pr_review_harness/{p.name}": hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(source.glob("*.py")) if p.is_file()}
          digest = hashlib.sha256(wheels[0].read_bytes()).hexdigest()
          result = subprocess.run([sys.executable, "-m", "pip", "install", "--disable-pip-version-check",
                                   "--no-deps", str(wheels[0])], check=False, timeout=180)
          if result.returncode:
              raise SystemExit("pinned_runtime_install_failed")
          import json
          from pathlib import Path
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"wheel_sha256={digest}\n")
              stream.write(f"module_count={len(modules)}\n")
              stream.write("inventory_sha256=" + hashlib.sha256(json.dumps(modules, sort_keys=True, separators=(",", ":")).encode()).hexdigest() + "\n")
          PY

      - name: Verify the frozen runtime inventory
        env:
          EXPECTED_MODULE_COUNT: '28'
          EXPECTED_INVENTORY_SHA256: ${{ steps.runtime-pin.outputs.runtime_inventory_sha256 }}
          EXPECTED_RUNTIME_SHA: ${{ steps.runtime-pin.outputs.runtime_sha }}
          ACTUAL_MODULE_COUNT: ${{ steps.runtime-wheel.outputs.module_count }}
          ACTUAL_INVENTORY_SHA256: ${{ steps.runtime-wheel.outputs.inventory_sha256 }}
          RUNTIME_SOURCE: ${{ github.workspace }}/trusted-runtime
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          if os.environ.get("ACTUAL_MODULE_COUNT") != os.environ.get("EXPECTED_MODULE_COUNT"):
              raise SystemExit("runtime_module_count_mismatch")
          if os.environ.get("ACTUAL_INVENTORY_SHA256") != os.environ.get("EXPECTED_INVENTORY_SHA256"):
              raise SystemExit("runtime_inventory_mismatch")
          result = subprocess.run(["git", "-C", os.environ["RUNTIME_SOURCE"], "rev-parse", "HEAD"],
                                  check=False, capture_output=True, text=True, timeout=10)
          if result.returncode or result.stdout.strip() != os.environ.get("EXPECTED_RUNTIME_SHA"):
              raise SystemExit("runtime_revision_mismatch")
          PY

      - name: Verify the fixed case and shared budget declaration
        working-directory: trusted-runner
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("experiments/model-only-shadow-trial-v1.json")
          plan = json.loads(path.read_text(encoding="utf-8"))
          case = plan["case"]
          budget = plan["budgets"]
          identity = plan["planned_provider_identity"]
          if plan.get("provider_identity_status") != "PLANNED_NOT_OBSERVED_SECRET_VALUES_OPAQUE":
              raise SystemExit("provider_identity_must_remain_planned")
          if plan.get("status") != "PREPARE_ONLY_LIVE_DISPATCH_DISABLED":
              raise SystemExit("live_dispatch_not_disabled")
          if (case.get("case_id"), case.get("base_sha"), case.get("head_sha"), case.get("snapshot_sha256")) != (
              "PR-464", "20a743f0434a1843aa00068483f608f1e213b2af",
              "bffc26f9e4bf95aca0c252e88a2396d03ece854c",
              "3fcb39bbe80bbc10d02fbfef98abc6f73f9f46b829776515a6c9f9df69787663",
          ):
              raise SystemExit("frozen_case_identity_mismatch")
          if (
              case.get("runtime_inventory_sha256") != "1c94fabdbd5419a2da5beeed1e6d72030af2af71531f3a58defe1bf0a34ff9c0"
              or case.get("runtime_module_tree_sha256") != "d8bdb53517abb7d85fff59805224f457f296832e7e0074b1485c50691dae1ad4"
          ):
              raise SystemExit("frozen_runtime_hash_contract_mismatch")
          if budget != {
              "writer_calls_max": 10, "audit_calls_max": 3, "total_provider_calls_max": 13,
              "max_request_bytes_per_call": 128000, "max_response_bytes_per_call": 32768,
              "max_output_tokens_per_llm_call": 1800, "writer_stage_deadline_seconds": 600,
              "audit_stage_deadline_seconds_per_call": 90, "audit_stage_deadline_seconds_total": 270,
              "total_provider_deadline_seconds": 870, "max_retries_per_task": 0,
          }:
              raise SystemExit("shadow_budget_mismatch")
          if identity != {
              "llm_base_url": "https://inference-api.nousresearch.com/v1",
              "llm_model": "openai/gpt-6-luna",
              "jev_base_url": "https://api.typesafe.ai/v1", "jev_model": "jev-latest",
          }:
              raise SystemExit("provider_identity_pin_mismatch")
          PY

      - name: Prepare the fixed PR-464 plan without credentials or provider calls
        working-directory: trusted-runner
        env:
          TRIAL_STARTED_EPOCH: ${{ steps.trial-start.outputs.started_epoch }}
          RUNTIME_WHEEL_SHA256: ${{ steps.runtime-wheel.outputs.wheel_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/run_real_case_trial.py \
            --mode staged-pr464 --prepare-only --input-contract specialist-input-v2 \
            --artifacts "$RUNNER_TEMP/private-shadow-preparation" \
            --cli "$(command -v pr-review)" --runtime-source "$GITHUB_WORKSPACE/trusted-runtime"

      # Writer and audit dispatch remain disabled pending reviewed same-job
      # integration of private packet inventory, stage-local request checks,
      # sanitized receipts, and cleanup. The claim request is checked only after
      # Jev returns and immediately before its dispatch. Keep this workflow name
      # stable for the capture guard.

      - name: Validate and sanitize the preparation receipt
        id: sanitize
        working-directory: trusted-runner
        run: |
          set -euo pipefail
          python3 scripts/sanitize_model_only_shadow_preflight.py \
            --summary "$RUNNER_TEMP/private-shadow-preparation/summary.json" \
            --manifest "$RUNNER_TEMP/private-shadow-preparation/manifest.json" \
            --output-dir "$RUNNER_TEMP/private-shadow-sanitized"
          echo 'validated=true' >> "$GITHUB_OUTPUT"

      - name: Upload only the sanitized preparation receipt
        if: steps.sanitize.outputs.validated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-shadow-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/private-shadow-sanitized/summary.json
            ${{ runner.temp }}/private-shadow-sanitized/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove private preparation workspace
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          for name in ("private-shadow-preparation", "private-shadow-sanitized"):
              path = root / name
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  continue
              if stat.S_ISLNK(info.st_mode) or not stat.S_ISDIR(info.st_mode) or path.parent.resolve() != root:
                  raise SystemExit("private_workspace_cleanup_refused")
              shutil.rmtree(path)
          PY

  live_writer:
    if: inputs.run_live_writer == true && github.event_name == 'workflow_dispatch' && github.repository == 'groktopus/codereview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the trusted runner at the dispatch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: groktopus/codereview
          ref: ${{ github.sha }}
          path: trusted-runner
          persist-credentials: false

      - name: Verify the trusted runner identity
        working-directory: trusted-runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          expected = os.environ.get("EXPECTED_SHA", "")
          if (os.environ.get("GITHUB_REPOSITORY") != "groktopus/codereview"
                  or os.environ.get("GITHUB_REF") != "refs/heads/main"
                  or os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
                  or not re.fullmatch(r"[0-9a-f]{40}", expected)):
              raise SystemExit("trusted_dispatch_context_invalid")
          result = subprocess.run(["git", "rev-parse", "HEAD"], check=False,
                                  capture_output=True, text=True, timeout=10)
          if result.returncode or result.stdout.strip() != expected:
              raise SystemExit("trusted_runner_revision_mismatch")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Check out the fixed read-only SlopSearX case
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: magnus919/SlopSearX
          ref: bffc26f9e4bf95aca0c252e88a2396d03ece854c
          path: target-repo
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the fixed target commits without running target code
        working-directory: target-repo
        env:
          EXPECTED_BASE: 20a743f0434a1843aa00068483f608f1e213b2af
          EXPECTED_HEAD: bffc26f9e4bf95aca0c252e88a2396d03ece854c
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          head = subprocess.run(["git", "rev-parse", "HEAD"], check=False,
                                capture_output=True, text=True, timeout=10)
          base = subprocess.run(["git", "cat-file", "-e", os.environ["EXPECTED_BASE"] + "^{commit}"],
                                check=False, timeout=10)
          if head.returncode or head.stdout.strip() != os.environ.get("EXPECTED_HEAD") or base.returncode:
              raise SystemExit("fixed_target_revision_mismatch")
          PY

      - name: Create private preflight workspace
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/private-shadow-preparation"

      - name: Prepare the exact current-runtime writer requests without credentials
        working-directory: trusted-runner
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-runner/src
          GITHUB_EVENT_PATH: ''
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/private-shadow-prepare-output"
          if python3 scripts/run_pr_review_stage_diagnostic.py \
            --stage-output "$RUNNER_TEMP/private-shadow-preparation/stage-diagnostic.json" -- \
            review \
            --repo "$GITHUB_WORKSPACE/target-repo" \
            --base 20a743f0434a1843aa00068483f608f1e213b2af \
            --head bffc26f9e4bf95aca0c252e88a2396d03ece854c \
            --profile "$GITHUB_WORKSPACE/trusted-runner/docs/real-case-trial-v1/profiles/PR-464.json" \
            --historical-checks-json "$GITHUB_WORKSPACE/trusted-runner/docs/real-case-trial-v1/checks/PR-464.json" \
            --limits "$GITHUB_WORKSPACE/trusted-runner/experiments/model-only-shadow-live-writer-limits-v1.json" \
            --provider-config "$GITHUB_WORKSPACE/trusted-runner/experiments/model-only-shadow-live-writer-provider-v1.json" \
            --mode AUTO --effect-policy READ_ONLY \
            --private-shadow-preflight-case-id PR-464 --max-claim-assessments 0 \
            --run-id "prepare-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$RUNNER_TEMP/private-shadow-prepare-output" --prepare-only --json \
            > "$RUNNER_TEMP/private-shadow-preparation/prepared.json" 2>/dev/null; then
            :
          else
            cli_exit_code=$?
            python3 scripts/extract_pr_review_failure_code.py \
              --input "$RUNNER_TEMP/private-shadow-preparation/prepared.json" \
              --stage-input "$RUNNER_TEMP/private-shadow-preparation/stage-diagnostic.json" \
              --exit-code "$cli_exit_code"
            exit "$cli_exit_code"
          fi

      - name: Verify the exact plan and write the fresh provider-free receipt
        id: exact-preflight
        working-directory: trusted-runner
        run: |
          set -euo pipefail
          python3 scripts/verify_model_only_shadow_live_preflight.py \
            --plan experiments/model-only-shadow-live-pr464-plan-v1.json \
            --prepared "$RUNNER_TEMP/private-shadow-preparation/prepared.json" \
            > "$RUNNER_TEMP/private-shadow-preparation/live-preflight-receipt.json"
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Check writer secret names and exact configured identity without printing values
        id: provider-identity
        if: steps.exact-preflight.outputs.verified == 'true'
        working-directory: trusted-runner
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/build_model_only_shadow_writer_provider_config.py \
            --plan experiments/model-only-shadow-live-pr464-plan-v1.json \
            --output-dir "$RUNNER_TEMP/private-shadow-runtime-config" > /dev/null
          echo 'validated=true' >> "$GITHUB_OUTPUT"

      - name: Run only the ten pinned read-only writer calls
        id: writer
        if: steps.exact-preflight.outputs.verified == 'true' && steps.provider-identity.outputs.validated == 'true'
        working-directory: trusted-runner
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-runner/src
          GITHUB_EVENT_PATH: ''
          PR_REVIEW_TRUSTED_PRIVATE_CAPTURE: '1'
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/private-shadow-live-output"
          if python3 scripts/run_pr_review_stage_diagnostic.py \
            --stage-output "$RUNNER_TEMP/private-shadow-preparation/writer-stage-diagnostic.json" -- \
            review \
            --repo "$GITHUB_WORKSPACE/target-repo" \
            --base 20a743f0434a1843aa00068483f608f1e213b2af \
            --head bffc26f9e4bf95aca0c252e88a2396d03ece854c \
            --profile "$GITHUB_WORKSPACE/trusted-runner/docs/real-case-trial-v1/profiles/PR-464.json" \
            --historical-checks-json "$GITHUB_WORKSPACE/trusted-runner/docs/real-case-trial-v1/checks/PR-464.json" \
            --limits "$GITHUB_WORKSPACE/trusted-runner/experiments/model-only-shadow-live-writer-limits-v1.json" \
            --provider-config "$RUNNER_TEMP/private-shadow-runtime-config/provider.json" \
            --mode AUTO --effect-policy READ_ONLY --max-claim-assessments 0 \
            --run-id "writer-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$RUNNER_TEMP/private-shadow-live-output" \
            --private-shadow-capture "$RUNNER_TEMP/private-writer-capture" \
            --private-shadow-case-id PR-464 \
            --private-shadow-plan "$GITHUB_WORKSPACE/trusted-runner/experiments/model-only-shadow-live-pr464-plan-v1.json" \
            --private-shadow-preflight-receipt "$RUNNER_TEMP/private-shadow-preparation/live-preflight-receipt.json" \
            --json > "$RUNNER_TEMP/private-shadow-preparation/writer-result.json" 2>/dev/null; then
          :
          else
            cli_exit_code=$?
            python3 scripts/extract_pr_review_failure_code.py \
              --input "$RUNNER_TEMP/private-shadow-preparation/writer-result.json" \
              --stage-input "$RUNNER_TEMP/private-shadow-preparation/writer-stage-diagnostic.json" \
              --exit-code "$cli_exit_code"
            exit "$cli_exit_code"
          fi

      - name: Sanitize the completed writer capture
        id: writer-sanitize
        if: steps.writer.outcome == 'success'
        working-directory: trusted-runner
        run: |
          set -euo pipefail
          python3 scripts/sanitize_model_only_shadow_writer_receipt.py \
            --capture-root "$RUNNER_TEMP/private-writer-capture" \
            --plan experiments/model-only-shadow-live-pr464-plan-v1.json \
            --preflight "$RUNNER_TEMP/private-shadow-preparation/live-preflight-receipt.json" \
            --output-dir "$RUNNER_TEMP/private-writer-sanitized" > /dev/null
          echo 'validated=true' >> "$GITHUB_OUTPUT"

      # AuditDispatchGuard checks each exact serialized request immediately
      # before its adapter dispatches. The claim request is checked only after
      # the Jev response has shaped it; no future request hash is fabricated.
      - name: Build private model-only audit configs
        id: audit-config
        if: steps.writer-sanitize.outputs.validated == 'true'
        working-directory: trusted-runner
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-runner/src
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
          JEV_MODEL: ${{ secrets.JEV_MODEL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/provider_config_from_env.py \
            --output-dir "$RUNNER_TEMP/private-shadow-audit-config" --json > /dev/null
          echo 'validated=true' >> "$GITHUB_OUTPUT"

      - name: Run one bounded model-only audit packet
        id: shadow-audit
        if: steps.writer-sanitize.outputs.validated == 'true' && steps.audit-config.outputs.validated == 'true'
        working-directory: trusted-runner
        env:
          PYTHONPATH: ${{ github.workspace }}/trusted-runner/src
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/run_model_only_shadow_audit.py \
            --capture-root "$RUNNER_TEMP/private-writer-capture" \
            --provider-config "$RUNNER_TEMP/private-shadow-audit-config/provider.json" \
            --jev-config "$RUNNER_TEMP/private-shadow-audit-config/decision.json" \
            --plan experiments/model-only-shadow-live-pr464-plan-v1.json \
            --limits experiments/model-only-shadow-audit-limits-v1.json \
            --output-root "$RUNNER_TEMP/private-shadow-audit-output" \
            --receipt "$RUNNER_TEMP/private-shadow-audit-receipt/shadow-audit-receipt.json" \
            --live > /dev/null
          echo 'completed=true' >> "$GITHUB_OUTPUT"

      - name: Validate and sanitize the model-only audit receipt
        id: audit-sanitize
        if: always() && steps.writer-sanitize.outputs.validated == 'true' && steps.shadow-audit.outcome != 'skipped'
        working-directory: trusted-runner
        run: |
          set -euo pipefail
          python3 scripts/sanitize_model_only_shadow_audit_receipt.py \
            --input "$RUNNER_TEMP/private-shadow-audit-receipt/shadow-audit-receipt.json" \
            --output-dir "$RUNNER_TEMP/private-shadow-audit-sanitized" > /dev/null
          echo 'validated=true' >> "$GITHUB_OUTPUT"

      - name: Upload only the hash-only writer receipt
        if: steps.writer-sanitize.outputs.validated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-shadow-writer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/private-writer-sanitized/writer-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload only the hash-only model-only audit receipt
        if: always() && steps.audit-sanitize.outputs.validated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-shadow-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/private-shadow-audit-sanitized/shadow-audit-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove private live-writer workspace
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          for name in (
              "private-shadow-preparation", "private-shadow-prepare-output",
              "private-shadow-runtime-config", "private-shadow-live-output",
              "private-writer-capture", "private-writer-sanitized",
              "private-shadow-audit-config", "private-shadow-audit-output",
              "private-shadow-audit-receipt", "private-shadow-audit-sanitized",
          ):
              path = root / name
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  continue
              if stat.S_ISLNK(info.st_mode) or not stat.S_ISDIR(info.st_mode) or path.parent.resolve() != root:
                  raise SystemExit("private_workspace_cleanup_refused")
              shutil.rmtree(path)
          PY
