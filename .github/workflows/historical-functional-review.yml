name: Historical SlopSearX functional diagnostic

on:
  workflow_dispatch:
    inputs:
      execute_live:
        description: "Run the bounded live diagnostic after exact-config sizing (default: prepare only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: historical-functional-review-pr466
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'groktopus/codereview' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the trusted runner at the dispatch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Fetch only the fixed target Git objects into a bare repository
        env:
          TARGET_DIR: ${{ runner.temp }}/slopsearx-pr466.git
        run: |
          set -euo pipefail
          git init --bare "$TARGET_DIR" >/dev/null
          timeout 120s git -C "$TARGET_DIR" -c protocol.version=2 fetch --no-tags --filter=blob:none \
            https://github.com/magnus919/SlopSearX.git \
            63e3ecd2f09d79c34e3594a3be74f017a1c5a12c \
            7bce9dd246f141eb961c52ae96061203a98f083b >/dev/null
      - name: Prepare exact production requests without provider calls
        env:
          TARGET_DIR: ${{ runner.temp }}/slopsearx-pr466.git
          OUTPUT_DIR: ${{ runner.temp }}/pr466-prepare
        run: python scripts/run_historical_functional_review.py prepare --target-bare "$TARGET_DIR" --output-dir "$OUTPUT_DIR"
      - name: Upload only the bounded prepare observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: historical-functional-pr466-prepare
          path: ${{ runner.temp }}/pr466-prepare/prepare-observation.json
          if-no-files-found: error
          retention-days: 14

  live-diagnostic:
    if: inputs.execute_live == true && github.repository == 'groktopus/codereview' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the trusted runner at the dispatch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Fetch only the fixed target Git objects into a bare repository
        env:
          TARGET_DIR: ${{ runner.temp }}/slopsearx-pr466.git
        run: |
          set -euo pipefail
          git init --bare "$TARGET_DIR" >/dev/null
          timeout 120s git -C "$TARGET_DIR" -c protocol.version=2 fetch --no-tags --filter=blob:none \
            https://github.com/magnus919/SlopSearX.git \
            63e3ecd2f09d79c34e3594a3be74f017a1c5a12c \
            7bce9dd246f141eb961c52ae96061203a98f083b >/dev/null
      - name: Run after fixed-input and exact-config preflight
        env:
          TARGET_DIR: ${{ runner.temp }}/slopsearx-pr466.git
          OUTPUT_DIR: ${{ runner.temp }}/pr466-review
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
          JEV_MODEL: ${{ secrets.JEV_MODEL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: python scripts/run_historical_functional_review.py run --target-bare "$TARGET_DIR" --output-dir "$OUTPUT_DIR"
      - name: Upload only review result and report files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: historical-functional-pr466-review
          path: |
            ${{ runner.temp }}/pr466-review/review-result.json
            ${{ runner.temp }}/pr466-review/review-report.md
          if-no-files-found: warn
          retention-days: 14
