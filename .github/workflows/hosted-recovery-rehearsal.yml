name: Secretless hosted recovery rehearsal

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run A stages a live fake request; Run B resumes its canceled checkpoint.
        required: true
        type: choice
        options:
          - run-a
          - run-b
      source_run_id:
        description: Required for run-b; numeric run ID of the canceled run-a workflow.
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hosted-recovery-rehearsal-${{ github.workflow }}-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'groktopus/codereview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact dispatched harness source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify canonical main and exact dispatched source commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          expected = os.environ.get('EXPECTED_SHA', '')
          if os.environ.get('WORKFLOW_REF') != 'refs/heads/main' or not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('canonical_main_source_identity_invalid')
          actual = subprocess.run(['git', 'rev-parse', 'HEAD'], check=True, capture_output=True, text=True, timeout=5).stdout.strip()
          if actual != expected:
              raise SystemExit('dispatched_source_sha_mismatch')
          PY

      - name: Set up Python
        timeout-minutes: 2
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Set up the pinned readiness artifact bridge runtime
        if: inputs.phase == 'run-a'
        timeout-minutes: 2
        uses: actions/setup-node@1e60f620b9541d83c2a0d7bbbd10743a27a4e3d6 # v4
        with:
          node-version: '24'

      - name: Install only the locked official artifact client
        if: inputs.phase == 'run-a'
        working-directory: scripts/actions-artifact-uploader
        timeout-minutes: 2
        env:
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_RESULTS_URL: ''
          ACTIONS_RUNTIME_URL: ''
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build a bounded wheel with the project-declared isolated build backend
        if: inputs.phase == 'run-a'
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/hosted-recovery-wheel"
          python -m pip wheel --no-deps \
            --wheel-dir "$RUNNER_TEMP/hosted-recovery-wheel" .
          python - <<'PY'
          import os
          from pathlib import Path
          wheels = list(Path(os.environ['RUNNER_TEMP'], 'hosted-recovery-wheel').glob('*.whl'))
          if len(wheels) != 1 or wheels[0].stat().st_size > 6_000_000:
              raise SystemExit('wheel_inventory_or_size_invalid')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write('RECOVERY_WHEEL=' + str(wheels[0].resolve()) + '\n')
          PY

      - name: Run A — publish readiness while the fake request remains held
        if: inputs.phase == 'run-a'
        timeout-minutes: 9
        uses: ./scripts/actions-artifact-uploader
        with:
          mode: hosted-recovery-run-a
          root: ${{ runner.temp }}/hosted-recovery-run-a
          stage: ${{ runner.temp }}/hosted-recovery-stage
          source_root: ${{ github.workspace }}
          wheel: ${{ env.RECOVERY_WHEEL }}

      - name: Retain Run A checkpoint, source wheel and identity manifest after cancellation
        if: always() && inputs.phase == 'run-a'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted-recovery-stage/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Run B — install the transferred wheel and resume the exact checkpoint
        if: inputs.phase == 'run-b'
        timeout-minutes: 10
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/hosted_recovery_rehearsal.py run-b \
            --root "$RUNNER_TEMP/hosted-recovery-run-b" \
            --stage "$RUNNER_TEMP/hosted-recovery-download" \
            --source-root "$GITHUB_WORKSPACE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --expected-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/hosted-recovery-resume"

      - name: Retain Run B resume proof
        if: always() && inputs.phase == 'run-b'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-recovery-resume-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted-recovery-resume/resume-evidence.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
