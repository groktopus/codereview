name: Reusable workflow instantiation diagnostic

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open SlopSearX pull request number to analyze
        required: true
        type: number

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: slopsearx-read-only-pilot-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Emit constant syntactically valid identities without network access
        id: resolve
        run: |
          printf '%s\n' 'base_ref=main' 'base_sha=0000000000000000000000000000000000000000' 'head_sha=1111111111111111111111111111111111111111' >> "$GITHUB_OUTPUT"

  analyze:
    needs: resolve-target
    if: needs.resolve-target.result == 'success'
    permissions:
      contents: read
      checks: read
      pull-requests: read
    uses: groktopus/codereview/.github/workflows/pr-analysis.yml@8052da90c269815ef6235a4fa7517c67b4ee6a65
    with:
      harness_repository: groktopus/codereview
      harness_sha: invalid-sha
      target_repository: magnus919/SlopSearX
      pull_request_number: 477
      base_ref: main
      base_sha: '0000000000000000000000000000000000000000'
      head_sha: '1111111111111111111111111111111111111111'
    secrets:
      LLM_BASE_URL: https://example.invalid
      LLM_MODEL: probe
      LLM_API_KEY: not-a-credential
      JEV_BASE_URL: https://example.invalid
      JEV_MODEL: probe
      JEV_API_KEY: not-a-credential
