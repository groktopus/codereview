name: PR review publication canary (write path disabled)

on:
  workflow_run:
    workflows:
      - PR Review Analysis
    types:
      - completed

# Serialize observations for each PR and keep every pending canary up to the
# GitHub queue limit. This ordering is operational only, not an effect lock.
concurrency:
  group: pr-review-publication-canary-${{ github.event.workflow_run.repository.id }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  queue: max

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  read-only-canary:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out only the protected publisher workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Set up the pinned artifact bridge runtime
        uses: actions/setup-node@1e60f620b9541d83c2a0d7bbbd10743a27a4e3d6 # v4
        with:
          node-version: '24'

      - name: Install only the locked official artifact client
        working-directory: scripts/actions-artifact-uploader
        env:
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_RESULTS_URL: ''
          ACTIONS_RUNTIME_URL: ''
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify platform-reported read-only run and PR bindings
        uses: ./scripts/actions-artifact-uploader
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_REVIEW_PUBLISHER_WORKFLOW_ID: ${{ vars.PR_REVIEW_PUBLISHER_WORKFLOW_ID }}
          PR_REVIEW_PUBLISHER_WORKFLOW_PATH: .github/workflows/pr-publish.yml
          PR_REVIEW_ANALYSIS_WORKFLOW_ID: ${{ vars.PR_REVIEW_ANALYSIS_WORKFLOW_ID }}
          PR_REVIEW_ANALYSIS_WORKFLOW_PATH: ${{ vars.PR_REVIEW_ANALYSIS_WORKFLOW_PATH }}
          PR_REVIEW_ANALYSIS_WORKFLOW_REF: ${{ vars.PR_REVIEW_ANALYSIS_WORKFLOW_REF }}
          PR_REVIEW_PUBLISHER_ACTOR: ${{ vars.PR_REVIEW_PUBLISHER_ACTOR }}
          PYTHONPATH: src

  # This is a permanent hard stop in this candidate. Enabling a repository
  # variable cannot turn it into a write job; a separately reviewed workflow
  # and verified writer credential capability are required first.
  publication-disabled:
    if: ${{ false && vars.PR_REVIEW_PUBLICATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo 'review_publication_disabled'
