name: Reusable read-only pull request analysis

on:
  workflow_call:
    inputs:
      harness_repository:
        description: 'Trusted harness repository, reviewed separately from the target'
        required: true
        type: string
      harness_sha:
        description: 'Full immutable 40-character commit SHA of trusted harness code and profiles'
        required: true
        type: string
      target_repository:
        description: 'Target owner/repository'
        required: true
        type: string
      pull_request_number:
        description: 'Pull request number in the target repository'
        required: true
        type: number
      base_ref:
        description: 'Target base branch name from the trusted PR event'
        required: true
        type: string
      base_sha:
        description: 'Target base commit SHA from the trusted PR event'
        required: true
        type: string
      head_sha:
        description: 'Target PR head commit SHA from the trusted PR event'
        required: true
        type: string
    secrets:
      LLM_BASE_URL:
        required: true
      LLM_MODEL:
        required: true
      LLM_API_KEY:
        required: true
      JEV_BASE_URL:
        required: true
      JEV_MODEL:
        required: true
      JEV_API_KEY:
        required: true
      HARNESS_READ_TOKEN:
        required: false

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: pr-analysis-${{ inputs.target_repository }}-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject mutable or malformed harness and target identities before checkout
        env:
          HARNESS_REPOSITORY: ${{ inputs.harness_repository }}
          HARNESS_SHA: ${{ inputs.harness_sha }}
          CALLER_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', os.environ['HARNESS_REPOSITORY']):
              raise SystemExit('harness_repository_invalid')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['HARNESS_SHA']):
              raise SystemExit('harness_revision_must_be_full_immutable_sha')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', os.environ['TARGET_REPOSITORY']):
              raise SystemExit('target_repository_invalid')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', os.environ['CALLER_REPOSITORY']):
              raise SystemExit('caller_repository_invalid')
          if os.environ['CALLER_REPOSITORY'] != os.environ['TARGET_REPOSITORY']:
              raise SystemExit('caller_target_repository_mismatch')
          if not os.environ['PR_NUMBER'].isdigit() or int(os.environ['PR_NUMBER']) < 1:
              raise SystemExit('pull_request_number_invalid')
          base_ref = os.environ['BASE_REF']
          if not base_ref or len(base_ref.encode('utf-8')) > 200:
              raise SystemExit('target_base_ref_invalid')
          checked_ref = subprocess.run(
              ['git', 'check-ref-format', 'refs/heads/' + base_ref],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=3, check=False,
          )
          if checked_ref.returncode:
              raise SystemExit('target_base_ref_invalid')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['BASE_SHA']):
              raise SystemExit('target_base_identity_invalid')
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['HEAD_SHA']):
              raise SystemExit('target_head_identity_invalid')
          PY
      - name: Check out the separately pinned trusted harness and profiles
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.harness_repository }}
          ref: ${{ inputs.harness_sha }}
          token: ${{ secrets.HARNESS_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Verify exact harness commit before installing or importing it
        env:
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
        run: |
          ACTUAL_HARNESS_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_HARNESS_SHA" != "$EXPECTED_HARNESS_SHA" ]; then
            echo 'checked_out_harness_revision_mismatch' >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - name: Validate pinned source and PR identity, then acquire bare target objects
        env:
          HARNESS_SHA: ${{ inputs.harness_sha }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          BASE_REF: ${{ inputs.base_ref }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          OBJECT_STORE: ${{ runner.temp }}/target.git
          EVENT_OUTPUT: ${{ runner.temp }}/pr-event.json
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from pr_review_harness.github import GitHubPRAdapter

          def git(*args, timeout=30):
              return subprocess.run(args, check=True, text=True, capture_output=True, timeout=timeout).stdout.strip()

          harness_sha = os.environ['HARNESS_SHA']
          target = os.environ['TARGET_REPOSITORY']
          number = int(os.environ['PR_NUMBER'])
          base_ref = os.environ['BASE_REF']
          base_sha = os.environ['BASE_SHA']
          head_sha = os.environ['HEAD_SHA']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', os.environ.get('GITHUB_REPOSITORY', '')):
              raise SystemExit('caller_repository_invalid')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', target):
              raise SystemExit('target_repository_invalid')
          if not re.fullmatch(r'[0-9a-f]{40}', harness_sha):
              raise SystemExit('harness_revision_must_be_full_sha')
          if any(not re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base_sha, head_sha)):
              raise SystemExit('target_revision_invalid')
          if number < 1 or not base_ref:
              raise SystemExit('pull_request_identity_invalid')
          if git('git', 'rev-parse', 'HEAD') != harness_sha:
              raise SystemExit('checked_out_harness_revision_mismatch')

          current = GitHubPRAdapter().pull_request(target, number)
          if current.get('state') != 'open' or current.get('draft') is True:
              raise SystemExit('target_pull_request_not_open_ready')
          if current['base_sha'] != base_sha or current['head_sha'] != head_sha:
              raise SystemExit('target_pull_request_revision_mismatch')

          store = os.environ['OBJECT_STORE']
          git('git', 'init', '--bare', store)
          url = 'https://github.com/' + target + '.git'
          git('git', '-C', store, 'fetch', '--no-tags', '--depth=1', url,
              f'+refs/pull/{number}/head:refs/pr/head', timeout=120)
          base_ref_full = 'refs/heads/' + base_ref
          if subprocess.run(['git', '-C', store, 'check-ref-format', base_ref_full], check=False, timeout=10).returncode:
              raise SystemExit('target_base_ref_invalid')
          git('git', '-C', store, 'fetch', '--no-tags', '--depth=1', url,
              f'+{base_sha}:refs/pr/base', timeout=120)
          if git('git', '-C', store, 'rev-parse', 'refs/pr/head') != head_sha:
              raise SystemExit('fetched_target_head_mismatch')
          if git('git', '-C', store, 'rev-parse', 'refs/pr/base') != base_sha:
              raise SystemExit('fetched_target_base_mismatch')

          event = {'number': number, 'pull_request': {'base': {'sha': base_sha}, 'head': {'sha': head_sha}}}
          Path(os.environ['EVENT_OUTPUT']).write_text(json.dumps(event), encoding='utf-8')
          PY
      - name: Validate generated PR event against the pinned analysis identity
        env:
          PR_EVENT_PATH: ${{ runner.temp }}/pr-event.json
          EXPECTED_PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import stat

          MAX_EVENT_BYTES = 16_384

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate_json_key")
                  result[key] = value
              return result

          def reject_constant(_value):
              raise ValueError("nonstandard_json_constant")

          def fail():
              raise SystemExit("generated_pull_request_event_invalid")

          def main():
              number_text = os.environ.get("EXPECTED_PR_NUMBER", "")
              base_sha = os.environ.get("EXPECTED_BASE_SHA", "")
              head_sha = os.environ.get("EXPECTED_HEAD_SHA", "")
              if not re.fullmatch(r"[1-9][0-9]{0,8}", number_text):
                  fail()
              if not re.fullmatch(r"[0-9a-f]{40}", base_sha) or not re.fullmatch(r"[0-9a-f]{40}", head_sha):
                  fail()
              try:
                  descriptor = os.open(os.environ["PR_EVENT_PATH"], os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
                  with os.fdopen(descriptor, "rb") as stream:
                      if not stat.S_ISREG(os.fstat(stream.fileno()).st_mode):
                          fail()
                      raw = stream.read(MAX_EVENT_BYTES + 1)
              except (KeyError, OSError):
                  fail()
              if len(raw) > MAX_EVENT_BYTES:
                  fail()
              try:
                  document = json.loads(
                      raw.decode("utf-8"),
                      object_pairs_hook=reject_duplicates,
                      parse_constant=reject_constant,
                  )
              except (UnicodeDecodeError, ValueError, json.JSONDecodeError, RecursionError):
                  fail()
              if not isinstance(document, dict) or set(document) != {"number", "pull_request"}:
                  fail()
              number = document.get("number")
              if isinstance(number, bool) or not isinstance(number, int) or number != int(number_text):
                  fail()
              pull_request = document.get("pull_request")
              if not isinstance(pull_request, dict) or set(pull_request) != {"base", "head"}:
                  fail()
              base = pull_request.get("base")
              head = pull_request.get("head")
              if not isinstance(base, dict) or set(base) != {"sha"}:
                  fail()
              if not isinstance(head, dict) or set(head) != {"sha"}:
                  fail()
              if base.get("sha") != base_sha or head.get("sha") != head_sha:
                  fail()

          if __name__ == "__main__":
              main()
          PY
      - name: Resolve the exact trusted profile for this target repository
        id: resolve-profile
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          python scripts/resolve_target_profile.py \
            --github-output "$GITHUB_OUTPUT" \
            --binding-artifact artifacts/profile-binding.json
      - name: Materialize private provider configuration from trusted secrets
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
          JEV_MODEL: ${{ secrets.JEV_MODEL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          python scripts/provider_config_from_env.py \
            --output-dir "$RUNNER_TEMP/pr-review-provider-config" \
            --json > "$RUNNER_TEMP/pr-review-provider-config-paths.json"
      - name: Produce a bounded read-only report from the bare target object store
        env:
          PR_EVENT_PATH: ${{ runner.temp }}/pr-event.json
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          PROFILE: ${{ steps.resolve-profile.outputs.profile_path }}
          EXPECTED_PROFILE_SHA256: ${{ steps.resolve-profile.outputs.profile_sha256 }}
          OBJECT_STORE: ${{ runner.temp }}/target.git
        run: |
          test "$(sha256sum "$PROFILE" | cut -d' ' -f1)" = "$EXPECTED_PROFILE_SHA256"
          mkdir -p artifacts
          env GITHUB_REPOSITORY="$TARGET_REPOSITORY" pr-review review \
            --repo "$OBJECT_STORE" \
            --event-file "$PR_EVENT_PATH" \
            --profile "$PROFILE" \
            --provider-config "$RUNNER_TEMP/pr-review-provider-config/provider.json" \
            --decision-config "$RUNNER_TEMP/pr-review-provider-config/decision.json" \
            --output artifacts/review \
            --run-id "pr-${{ inputs.pull_request_number }}-${{ github.run_id }}" \
            --capture-recovery-inputs artifacts/recovery-inputs.json \
            --mode AUTO \
            --json > artifacts/review-result.json
      - name: Record recovery identity and artifact digests
        id: recovery-manifest
        if: always()
        env:
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.sha }}
          RUN_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLED_WORKFLOW_REF: ${{ job.workflow_ref }}
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          CALLED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          CALLED_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HARNESS_REPOSITORY: ${{ inputs.harness_repository }}
          HARNESS_SHA: ${{ inputs.harness_sha }}
          PROFILE: ${{ steps.resolve-profile.outputs.profile_path }}
          EXPECTED_PROFILE_SHA256: ${{ steps.resolve-profile.outputs.profile_sha256 }}
          PROVIDER_CONFIG: ${{ runner.temp }}/pr-review-provider-config/provider.json
          DECISION_CONFIG: ${{ runner.temp }}/pr-review-provider-config/decision.json
        run: |
          python scripts/pr_analysis_artifact_manifest.py \
            --artifact-root artifacts \
            --workflow-repository "$WORKFLOW_REPOSITORY" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --workflow-run-head-sha "$WORKFLOW_RUN_HEAD_SHA" \
            --run-workflow-ref "$RUN_WORKFLOW_REF" \
            --called-workflow-ref "$CALLED_WORKFLOW_REF" \
            --called-workflow-sha "$CALLED_WORKFLOW_SHA" \
            --called-workflow-repository "$CALLED_WORKFLOW_REPOSITORY" \
            --called-workflow-file-path "$CALLED_WORKFLOW_FILE_PATH" \
            --target-repository "$TARGET_REPOSITORY" \
            --pull-request-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --harness-repository "$HARNESS_REPOSITORY" \
            --harness-sha "$HARNESS_SHA" \
            --expected-profile-sha256 "$EXPECTED_PROFILE_SHA256" \
            --profile "$PROFILE" \
            --provider-config "$PROVIDER_CONFIG" \
            --decision-config "$DECISION_CONFIG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.recovery-manifest.outcome == 'success'
        with:
          name: pr-review-${{ inputs.pull_request_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
