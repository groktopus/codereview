name: Selected control HTTP TLS transport probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selected-control-transport-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secretless-loopback-pair:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'groktopus/codereview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - name: Initialize the private bounded artifact directory
        timeout-minutes: 1
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/selected-control-transport-pair
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$ARTIFACT_DIR"
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Check out the exact manually dispatched main revision
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
        with:
          repository: groktopus/codereview
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up isolated Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 2
        with:
          python-version: '3.13'

      - name: Install the Linux trace observer
        id: observer
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes strace

      - name: Build and verify the exact installed source
        id: runtime
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$ARTIFACT_DIR" "$RUNNER_TEMP/transport-wheelhouse"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/transport-wheelhouse" .
          python -m venv "$RUNNER_TEMP/transport-venv"
          "$RUNNER_TEMP/transport-venv/bin/python" -m pip install --no-deps --no-index "$RUNNER_TEMP/transport-wheelhouse"/*.whl
          python - "$SOURCE_ROOT" "$RUNNER_TEMP/transport-venv/bin/python" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          interpreter = sys.argv[2]
          artifact_dir = os.environ["ARTIFACT_DIR"]
          source_sha = subprocess.run(
              ["git", "rev-parse", "HEAD"], cwd=root, check=True,
              capture_output=True, text=True, timeout=10,
          ).stdout.strip()
          if source_sha != os.environ["SOURCE_SHA"] or not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("source_pin_mismatch")
          source_dir = root / "src/pr_review_harness"
          source = {
              "pr_review_harness/" + path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(source_dir.glob("*.py")) if path.is_file() and not path.is_symlink()
          }
          if len(source) != 28:
              raise SystemExit("source_module_inventory_invalid")
          code = (
              "import hashlib,json,pathlib,pr_review_harness; "
              "p=pathlib.Path(pr_review_harness.__file__).parent; "
              "print(json.dumps({'pr_review_harness/'+x.name:hashlib.sha256(x.read_bytes()).hexdigest() "
              "for x in sorted(p.glob('*.py')) if x.is_file()},sort_keys=True))"
          )
          installed_result = subprocess.run(
              [interpreter, "-c", code], cwd=artifact_dir, check=True, capture_output=True,
              text=True, timeout=15,
              env={"PATH": os.environ.get("PATH", "/usr/bin:/bin"), "HOME": artifact_dir},
          )
          installed = json.loads(installed_result.stdout)
          if installed != source:
              raise SystemExit("installed_module_inventory_mismatch")
          observer_code = (
              "import json; from pr_review_harness.external_effect_observer import "
              "OBSERVER_ID,SYSCALL_SCOPE,TRACE_MAX_BYTES; "
              "print(json.dumps({'observer_id':OBSERVER_ID,'syscall_scope':SYSCALL_SCOPE,"
              "'trace_cap_bytes':TRACE_MAX_BYTES},sort_keys=True))"
          )
          observer = json.loads(subprocess.run(
              [interpreter, "-c", observer_code], cwd=artifact_dir, check=True,
              capture_output=True, text=True, timeout=15,
              env={"PATH": os.environ.get("PATH", "/usr/bin:/bin"), "HOME": artifact_dir},
          ).stdout)
          expected_scope = ["%process", "%file", "socket", "connect", "bind", "listen", "accept", "accept4", "shutdown"]
          if observer != {
              "observer_id": "linux-strace-syscall-observer.v3",
              "syscall_scope": expected_scope,
              "trace_cap_bytes": 1_048_576,
          }:
              raise SystemExit("observer_contract_mismatch")
          PY

      - name: Run one HTTP control and conditionally one TLS control in a loopback namespace
        id: probe
        timeout-minutes: 13
        run: |
          set -euo pipefail
          output="$ARTIFACT_DIR/transport-pair.json"
          rm -f "$output"
          set +e
          sudo unshare --net --fork -- /bin/bash -c '
              set -euo pipefail
              ip link set lo up
              runner_uid="$1"
              runner_gid="$2"
              shift 2
              exec /usr/bin/setpriv --reuid "$runner_uid" --regid "$runner_gid" --clear-groups -- "$@"
          ' _ "$(id -u)" "$(id -g)" /usr/bin/env -i \
            ARTIFACT_DIR="$ARTIFACT_DIR" \
            PROBE_PYTHON="$RUNNER_TEMP/transport-venv/bin/python" \
            PROBE_CLI="$RUNNER_TEMP/transport-venv/bin/pr-review" \
            PROBE_SCRIPT="$SOURCE_ROOT/scripts/selected_control_trace_attribution.py" \
            HOME="$ARTIFACT_DIR" \
            PATH="/usr/local/bin:/usr/bin:/bin" \
            /bin/bash -c '
              set -euo pipefail
              exec "$PROBE_PYTHON" "$PROBE_SCRIPT" --cli "$PROBE_CLI" --workdir "$ARTIFACT_DIR" --transport-pair
            ' > "$output" 2>/dev/null
          probe_result=$?
          set -e
          if [ ! -f "$output" ] || [ "$(wc -c < "$output")" -gt 65536 ] || ! python -m json.tool "$output" >/dev/null 2>&1; then
            printf '{"status":"FAILED","reason":"receipt_missing_oversize_or_invalid"}\n' > "$output"
            probe_result=1
          fi
          echo "exit_code=$probe_result" >> "$GITHUB_OUTPUT"
          if [ "$probe_result" -ne 0 ]; then
            echo "transport_pair_incomplete" >&2
            exit 1
          fi

      - name: Validate the exact bounded receipt and source identity
        id: safe
        if: always()
        timeout-minutes: 1
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          OBSERVER_OUTCOME: ${{ steps.observer.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          receipt="$ARTIFACT_DIR/transport-pair.json"
          set +e
          python scripts/validate_selected_control_transport_receipt.py \
            "$receipt" --source-root "$SOURCE_ROOT" --expected-sha "$SOURCE_SHA" --diagnostic-json \
            > "$ARTIFACT_DIR/validation-status.json" 2>/dev/null
          validation_exit=$?
          set -e
          VALIDATION_EXIT_CODE="$validation_exit" python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          expected = os.environ.get("SOURCE_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("expected_source_identity_invalid")
          outcomes = {key: os.environ.get(key, "") for key in (
              "CHECKOUT_OUTCOME", "PYTHON_OUTCOME", "OBSERVER_OUTCOME", "RUNTIME_OUTCOME", "PROBE_OUTCOME"
          )}
          validation_codes = {
              "receipt_json_invalid", "receipt_encoding_invalid", "receipt_io_error", "validator_internal_unknown",
              "receipt_fields_invalid", "receipt_hash_invalid", "trace_state_invalid", "trace_count_invalid",
              "trace_syscalls_invalid", "trace_syscall_count_invalid", "complete_trace_accounting_mismatch",
              "trace_path_fields_invalid", "trace_path_basis_invalid", "trace_path_state_invalid",
              "trace_path_visibility_invalid", "trace_path_counts_invalid", "trace_path_class_counts_invalid",
              "trace_path_count_invalid", "trace_path_target_fields_invalid", "trace_path_target_count_invalid",
              "trace_path_total_mismatch", "arm_fields_invalid", "arm_state_invalid", "skipped_arm_fields_invalid",
              "arm_observer_mode_invalid", "arm_observer_coverage_invalid", "arm_cli_result_presence_invalid",
              "arm_coverage_state_invalid", "arm_native_advisory_status_invalid", "arm_claim_statuses_invalid",
              "complete_arm_actual_criteria_mismatch", "arm_task_ids_invalid", "arm_task_statuses_invalid",
              "arm_task_lens_invalid", "arm_task_status_invalid", "payload_fields_invalid", "payload_size_invalid",
              "expected_source_sha_invalid", "receipt_file_invalid", "receipt_contract_invalid",
              "receipt_source_identity_mismatch", "diagnostic_script_dirty", "diagnostic_script_hash_mismatch",
              "runtime_module_identity_mismatch", "receipt_trace_budget_mismatch", "receipt_cli_budget_mismatch",
              "receipt_syscall_scope_mismatch", "receipt_tls_safety_mismatch", "receipt_effect_scope_mismatch",
              "receipt_run_identity_mismatch", "receipt_task_scope_mismatch", "receipt_case_identity_invalid",
              "receipt_arms_invalid", "tls_without_complete_http", "arm_identity_binding_mismatch",
              "complete_pair_arm_mismatch", "complete_pair_comparison_missing", "complete_pair_payload_mismatch",
              "complete_pair_config_mismatch", "receipt_pair_state_invalid", "comparison_fields_invalid",
              "comparison_boolean_invalid", "comparison_trace_bytes_invalid", "comparison_syscall_delta_invalid",
              "comparison_trace_arithmetic_mismatch", "comparison_syscall_arithmetic_mismatch",
              "complete_pair_comparison_false", "receipt_secret_or_pem_detected",
          }
          validation = None
          try:
              status_path = Path(os.environ["ARTIFACT_DIR"]) / "validation-status.json"
              with status_path.open("rb") as source:
                  raw = source.read(513)
              def unique_object(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError("duplicate_key")
                      result[key] = value
                  return result
              if len(raw) <= 512:
                  candidate = json.loads(raw, object_pairs_hook=unique_object,
                      parse_constant=lambda _value: (_ for _ in ()).throw(ValueError("nonfinite")))
                  if (isinstance(candidate, dict) and set(candidate) == {"contract_version", "status", "rejection_code"}
                      and candidate["contract_version"] == "transport-receipt-validation.v1"
                      and type(candidate["status"]) is str and candidate["status"] in {"ACCEPTED", "REJECTED"}
                      and (candidate["rejection_code"] is None or (type(candidate["rejection_code"]) is str
                          and candidate["rejection_code"] in validation_codes))):
                      validation = candidate
          except (OSError, UnicodeDecodeError, ValueError, TypeError, json.JSONDecodeError):
              validation = None
          validation_exit = os.environ.get("VALIDATION_EXIT_CODE", "")
          if (validation == {"contract_version": "transport-receipt-validation.v1", "status": "ACCEPTED", "rejection_code": None}
              and validation_exit == "0" and outcomes["PROBE_OUTCOME"] == "success"):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("safe=true\naccepted=true\n")
              raise SystemExit(0)
          validator_rejection = (
              validation["rejection_code"]
              if validation is not None and validation["status"] == "REJECTED"
              and validation["rejection_code"] in validation_codes and validation_exit == "1"
              else None
          )
          reason = (
              "CHECKOUT_FAILED" if outcomes["CHECKOUT_OUTCOME"] != "success" else
              "PYTHON_SETUP_FAILED" if outcomes["PYTHON_OUTCOME"] != "success" else
              "OBSERVER_INSTALL_FAILED" if outcomes["OBSERVER_OUTCOME"] != "success" else
              "RUNTIME_BUILD_FAILED" if outcomes["RUNTIME_OUTCOME"] != "success" else
              "PROBE_NOT_STARTED" if outcomes["PROBE_OUTCOME"] == "skipped" else
              "PROBE_FAILED" if outcomes["PROBE_OUTCOME"] != "success" else
              "PAIR_RECEIPT_REJECTED" if validator_rejection is not None else
              "VALIDATOR_OUTPUT_UNKNOWN"
          )
          checkout_sha = None
          source_root = Path(os.environ.get("SOURCE_ROOT", ""))
          if outcomes["CHECKOUT_OUTCOME"] == "success" and source_root.is_dir():
              try:
                  result = subprocess.run(
                      ["git", "-C", str(source_root), "rev-parse", "HEAD"],
                      stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                      timeout=3, check=True,
                  )
                  candidate = result.stdout.decode("ascii").strip()
                  if re.fullmatch(r"[0-9a-f]{40}", candidate):
                      checkout_sha = candidate
              except (OSError, subprocess.SubprocessError, UnicodeDecodeError):
                  checkout_sha = None
          if checkout_sha is not None and checkout_sha != expected:
              reason = "CHECKOUT_SOURCE_MISMATCH"
          receipt = {
              "contract_version": "selected-control-transport-not-observed.v2",
              "state": "NOT_OBSERVED",
              "reason_code": reason,
              "validator_rejection_code": validator_rejection if reason == "PAIR_RECEIPT_REJECTED" else None,
              "expected_source_sha": expected,
              "checkout_source_sha": checkout_sha,
              "checkout_source_matches_expected": checkout_sha == expected if checkout_sha else None,
              "installed_runtime_source_sha": expected if outcomes["RUNTIME_OUTCOME"] == "success" and checkout_sha == expected else None,
              "probe_step_outcome": outcomes["PROBE_OUTCOME"] if outcomes["PROBE_OUTCOME"] in {"success", "failure", "cancelled", "skipped"} else "unknown",
              "execution_state": "NOT_STARTED" if outcomes["PROBE_OUTCOME"] == "skipped" else "ATTEMPTED_OR_INTERRUPTED",
              "actual_provider_calls": "UNKNOWN",
          }
          allowed = {
              "contract_version", "state", "reason_code", "validator_rejection_code", "expected_source_sha", "checkout_source_sha",
              "checkout_source_matches_expected", "installed_runtime_source_sha", "probe_step_outcome",
              "execution_state", "actual_provider_calls",
          }
          if (set(receipt) != allowed or receipt["reason_code"] not in {
              "CHECKOUT_FAILED", "PYTHON_SETUP_FAILED", "OBSERVER_INSTALL_FAILED", "RUNTIME_BUILD_FAILED",
              "PROBE_NOT_STARTED", "PROBE_FAILED", "PAIR_RECEIPT_REJECTED", "VALIDATOR_OUTPUT_UNKNOWN",
              "CHECKOUT_SOURCE_MISMATCH",
          } or (receipt["validator_rejection_code"] is not None
              and receipt["validator_rejection_code"] not in validation_codes)
              or (reason == "PAIR_RECEIPT_REJECTED") != (receipt["validator_rejection_code"] is not None)):
              raise SystemExit("not_observed_receipt_contract_invalid")
          encoded = (json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n").encode()
          if len(encoded) > 2048:
              raise SystemExit("not_observed_receipt_limit_exceeded")
          temporary = Path(os.environ["ARTIFACT_DIR"]) / "transport-pair.json.tmp"
          target = temporary.with_suffix("")
          temporary.write_bytes(encoded)
          temporary.replace(target)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("safe=true\naccepted=false\n")
          PY
          python3 -m json.tool "$receipt" >/dev/null

      - name: Upload only the source-bound bounded receipt
        if: always() && steps.safe.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 2
        with:
          name: selected-control-transport-pair-${{ github.run_id }}
          path: ${{ runner.temp }}/selected-control-transport-pair/transport-pair.json
          if-no-files-found: error
          retention-days: 3

      - name: Require a strictly accepted transport receipt
        if: always()
        timeout-minutes: 1
        env:
          RECEIPT_ACCEPTED: ${{ steps.safe.outputs.accepted }}
        run: |
          set -euo pipefail
          if [ "$RECEIPT_ACCEPTED" != "true" ]; then
            echo "transport_receipt_not_accepted" >&2
            exit 1
          fi
