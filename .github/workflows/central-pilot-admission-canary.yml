name: Central pilot read-only admission canary

on:
  workflow_run:
    workflows:
      - SlopSearX read-only review pilot
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing successful central pilot run ID for a separate manual rehearsal
        required: true
        default: '36531683964'
        type: string
      source_run_attempt:
        description: Exact attempt number of the existing run
        required: true
        default: '1'
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: central-pilot-admission-${{ github.event.workflow_run.id || inputs.source_run_id || github.run_id }}-${{ github.event.workflow_run.run_attempt || inputs.source_run_attempt || github.run_attempt }}
  queue: max

jobs:
  read-only-admission:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.repository.full_name == 'groktopus/codereview' &&
           github.event.workflow_run.conclusion == 'success') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out only the protected canary workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Verify source run and current PR using bounded read-only requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          RECEIPT_PATH: ${{ runner.temp }}/central-pilot-candidate-receipt.json
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            python3 scripts/central_pilot_admission.py \
              --event-name workflow_run \
              --event-path "$GITHUB_EVENT_PATH" \
              --receipt-output "$RECEIPT_PATH"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python3 scripts/central_pilot_admission.py \
              --event-name workflow_dispatch \
              --run-id "$SOURCE_RUN_ID" \
              --attempt "$SOURCE_RUN_ATTEMPT" \
              --receipt-output "$RECEIPT_PATH"
          else
            echo 'admission_trigger_invalid' >&2
            exit 2
          fi

      - name: Retain only the hash-based candidate receipt for seven days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: central-pilot-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/central-pilot-candidate-receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
