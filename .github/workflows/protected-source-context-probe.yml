name: Protected PR source context probe (disabled)

on:
  pull_request_target:
    branches:
      - main # Replace with the protected default branch before qualification.
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: protected-source-context-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observe:
    # Deliberate hard stop. Enable only in a reviewed target-repository change.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out only the protected event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Record context, default-branch tip, and read-only API observations
        timeout-minutes: 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PYTHONPATH: src
        run: python scripts/protected_source_context_probe.py
