name: Harness verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effect-observer:
    name: Linux external observer contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Require strace and record the exact observer runtime identity
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pr_review_harness.external_effect_observer | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install the hash-locked development/test set
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Measure bounded events for installed provider-free review preparation
        run: |
          set -euo pipefail
          python scripts/effect_observer_smoke.py | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python -m pytest -q -s tests/test_external_effect_observer.py
      - run: ruff check src/pr_review_harness/external_effect_observer.py tests/test_external_effect_observer.py

  tests:
    name: Tests and lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the hash-locked development/test set
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Strictly type-check stable boundary contracts
        run: python -m mypy
      - name: Prove a wrong-shape boundary record is rejected
        run: |
          set -euo pipefail
          if python -m mypy --strict --follow-imports=silent --no-incremental src/pr_review_harness/typecheck_probe.pyi > typecheck-negative.log 2>&1; then
            echo "negative typed boundary probe unexpectedly passed"
            exit 1
          fi
          grep -Fq 'TypedDict item "unit_ids" has type "list[str]"' typecheck-negative.log
      - run: python -m pytest -q -m "not compatibility"
      - run: ruff check .

  format-and-complexity:
    name: Formatting and complexity ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the hash-locked development/test set
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Verify canonical formatting
        run: ruff format --check .
      - name: Prove a new over-threshold function fails the guard
        run: |
          set -euo pipefail
          mkdir -p .complexity-seeded
          trap 'rm -rf .complexity-seeded' EXIT
          python - <<'PY'
          from pathlib import Path

          body = "".join(f"    value_{index} = {index}\n" for index in range(8))
          Path(".complexity-seeded/mod.py").write_text(f"def seeded() -> int:\n{body}    return value_0\n", encoding="utf-8")
          PY
          set +e
          python scripts/check_complexity.py \
            --paths .complexity-seeded \
            --threshold 5 \
            --baseline scripts/complexity-baseline.v1.json \
            --json > complexity-seeded.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected seeded over-threshold function to exit 1, got $status"
            cat complexity-seeded.json
            exit 1
          fi
          python - <<'PY'
          import json

          report = json.load(open("complexity-seeded.json", encoding="utf-8"))
          assert report["status"] == "FAIL", report
          assert [finding["code"] for finding in report["findings"]] == ["NEW_OVER_THRESHOLD"], report
          PY
      - name: Enforce the checked function-length baseline
        run: |
          set -euo pipefail
          python scripts/check_complexity.py --json --summary complexity-report.md | tee complexity-report.json
      - name: Run complexity guard regression tests
        run: python -m pytest -q tests/test_complexity_guard.py
      - name: Retain the complexity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-complexity-${{ github.run_id }}
          path: |
            complexity-report.json
            complexity-report.md
            complexity-seeded.json
          if-no-files-found: warn
          retention-days: 7

  compatibility:
    name: Historical compatibility suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the hash-locked development/test set
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Run the historical compatibility suite separately
        run: python -m pytest -q -m compatibility

  lock-freshness:
    name: Lock freshness, hashes, and zero runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the hash-locked development/test set
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Prove uv.lock is current and requirements-dev.lock is a byte-identical hashed export
        run: |
          set -euo pipefail
          python scripts/check_dev_lock.py --json --summary lock-freshness.md | tee lock-freshness.json
          cat lock-freshness.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run the lock, packaging, and public-surface regression tests
        run: python -m pytest -q tests/test_dependency_supply_chain.py tests/test_public_surface.py
      - name: Retain the lock freshness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-lock-freshness-${{ github.run_id }}
          path: |
            lock-freshness.json
            lock-freshness.md
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Coverage floors and per-module report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install the hash-locked development/test set
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Run the suite with line coverage
        run: |
          set -euo pipefail
          # The wall-clock assertion below is covered by the plain tests job;
          # coverage tracing makes its 1.6s deadline contention-sensitive
          # (VD-2 tracks making it tolerant). Deselect it only for measurement.
          python -m pytest -q -m "not compatibility" \
            --deselect tests/test_engine.py::test_timeout_becomes_partial_and_does_not_wait_past_deadline \
            --cov=pr_review_harness \
            --cov-report=json:coverage.json \
            --cov-report=term
      - name: Enforce coverage floors and publish the job summary
        run: |
          set -euo pipefail
          python scripts/coverage_gate.py \
            --coverage-json coverage.json \
            --summary coverage-summary.md
      - name: Retain the coverage report for this run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-coverage-${{ github.run_id }}
          path: |
            coverage.json
            coverage-summary.md
          if-no-files-found: warn
          retention-days: 7

  documentation-truth:
    name: Documentation truth (links, evidence, seeded freshness)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install development and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Check relative links across README and all docs, including issues
        run: python scripts/check_relative_links.py
      - name: Preserve DT-2 docs index coverage
        run: python scripts/check_docs_index.py
      - name: Check GA-2 decision-record index and safety-invariant links (structural; not PR-diff enforcement)
        run: python scripts/check_decision_records.py
      - name: Check GA-3 CODEOWNERS coverage, ownership sections, and backlog triage
        run: python scripts/check_ownership.py
      - name: Enforce release metadata and changelog classification
        run: |
          set -euo pipefail
          python scripts/check_changelog.py
          python scripts/check_version_policy.py
      - name: Run living-document truth and provenance checks
        run: >-
          python scripts/check_docs_truth.py
          --sha-manifest scripts/documentation-sha-references.v1.json
          --contract-ids scripts/documentation-contract-ids.v1.json
      - name: Verify freshness checker fails on seeded stale status
        run: |
          set -euo pipefail
          set +e
          python scripts/check_docs_truth.py \
            --sha-manifest scripts/documentation-sha-references.v1.json \
            --contract-ids scripts/documentation-contract-ids.v1.json \
            --freshness-manifest tests/fixtures/docs_truth/freshness-stale.json \
            --json > docs-truth-stale.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected seeded stale status to exit 1, got $status"
            cat docs-truth-stale.json
            exit 1
          fi
          python - <<'PY'
          import json
          result = json.load(open("docs-truth-stale.json", encoding="utf-8"))
          codes = {item["code"] for item in result["findings"]}
          assert "STATUS_STALE" in codes, result
          PY
      - name: Prove CLI rejects combined seeded link, claim, SHA, and contract violations
        run: |
          set -euo pipefail
          set +e
          python scripts/check_docs_truth.py \
            --sha-manifest tests/fixtures/docs_truth/seeded-sha-manifest.json \
            --contract-ids scripts/documentation-contract-ids.v1.json \
            --document tests/fixtures/docs_truth/seeded-status.md \
            --json > docs-truth-seeded.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected seeded documentation truth violations to exit 1, got $status"
            cat docs-truth-seeded.json
            exit 1
          fi
          python - <<'PY'
          import json
          result = json.load(open("docs-truth-seeded.json", encoding="utf-8"))
          codes = {item["code"] for item in result["findings"]}
          expected = {"PRODUCTION_READY", "SHA_NOT_IN_REPOSITORY", "SUPERSEDED_CONTRACT_UNMARKED"}
          assert expected <= codes, result
          PY
          set +e
          python scripts/check_relative_links.py README.md tests/fixtures/docs_truth/seeded-bad-link.md
          link_status=$?
          set -e
          test "$link_status" -eq 1
      - name: Run seeded docs truth regression tests
        run: python -m pytest -q tests/test_docs_truth.py tests/test_docs_tooling.py tests/test_decision_records.py

  status-evidence:
    name: Status evidence (generated block, links, stale gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install development and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Verify the generated block and manifest are reproducible and linked
        run: |
          set -euo pipefail
          python scripts/generate_status_evidence.py --check --json | tee status-evidence-report.json
      - name: Gate the generated status evidence against DT-3 freshness
        run: >-
          python scripts/check_docs_truth.py
          --sha-manifest scripts/documentation-sha-references.v1.json
          --contract-ids scripts/documentation-contract-ids.v1.json
          --freshness-manifest scripts/documentation-status-evidence.v1.json
      - name: Fail on a seeded stale status evidence record
        run: |
          set -euo pipefail
          set +e
          python scripts/check_docs_truth.py \
            --sha-manifest scripts/documentation-sha-references.v1.json \
            --contract-ids scripts/documentation-contract-ids.v1.json \
            --freshness-manifest tests/fixtures/docs_truth/freshness-stale.json \
            --json > status-evidence-stale.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected seeded stale status to exit 1, got $status"
            cat status-evidence-stale.json
            exit 1
          fi
          python - <<'PY'
          import json
          result = json.load(open("status-evidence-stale.json", encoding="utf-8"))
          codes = {item["code"] for item in result["findings"]}
          assert "STATUS_STALE" in codes, result
          PY
      - name: Fail on a seeded superseded contract reference
        run: |
          set -euo pipefail
          set +e
          python scripts/check_docs_truth.py \
            --sha-manifest tests/fixtures/docs_truth/empty-sha-manifest.json \
            --contract-ids scripts/documentation-contract-ids.v1.json \
            --document tests/fixtures/docs_truth/seeded-superseded-contract.md \
            --json > status-evidence-superseded.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected seeded superseded contract to exit 1, got $status"
            cat status-evidence-superseded.json
            exit 1
          fi
          python - <<'PY'
          import json
          result = json.load(open("status-evidence-superseded.json", encoding="utf-8"))
          codes = {item["code"] for item in result["findings"]}
          assert "SUPERSEDED_CONTRACT_UNMARKED" in codes, result
          PY
      - name: Run generated status evidence regression tests
        run: python -m pytest -q tests/test_status_evidence.py
      - name: Lint the status evidence generator and tests
        run: ruff check scripts/generate_status_evidence.py tests/test_status_evidence.py
      - name: Retain the status evidence reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-status-evidence-${{ github.run_id }}
          path: |
            status-evidence-report.json
            status-evidence-stale.json
            status-evidence-superseded.json
          if-no-files-found: warn
          retention-days: 7

  completeness-gate:
    name: Review completeness gate (fixture baseline + seeded regression)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Gate the deterministic fixture baseline and retain the verdict
        run: |
          set -euo pipefail
          python scripts/check_completeness.py \
            --baseline tests/fixtures/completeness/baseline.v1.json \
            --result tests/fixtures/completeness/good-result.json \
            --json | tee completeness-good-verdict.json
      - name: Gate the frozen-corpus completeness baseline
        run: |
          set -euo pipefail
          python scripts/check_completeness.py \
            --baseline examples/evaluation/completeness-baseline-v1/baseline.json \
            --results-manifest examples/evaluation/completeness-baseline-v1/manifest.json \
            --json | tee completeness-frozen-baseline-verdict.json
      - name: Prove the gate rejects a seeded completeness regression
        run: |
          set -euo pipefail
          set +e
          python scripts/check_completeness.py \
            --baseline tests/fixtures/completeness/baseline.v1.json \
            --result tests/fixtures/completeness/seeded-regression-result.json \
            --json > completeness-seeded-regression-verdict.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected seeded regression to exit 1, got $status"
            cat completeness-seeded-regression-verdict.json
            exit 1
          fi
          python - <<'PY'
          import json
          verdict = json.load(open("completeness-seeded-regression-verdict.json"))
          assert verdict["status"] == "FAIL", verdict
          codes = {finding["code"] for item in verdict["verdicts"] for finding in item["findings"]}
          assert "KNOWN_COMPLETE_REGRESSION" in codes, codes
          assert "COMPLETION_RATIO_REGRESSION" in codes, codes
          PY
      - name: Upload completeness verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-completeness-${{ github.run_id }}
          path: completeness-*-verdict.json
          if-no-files-found: error
          retention-days: 7

  quality-scorecard:
    name: Quality scorecard (retained synthetic pilot + seeded gate regression)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the hash-locked development/test set
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Generate the scorecard for the retained synthetic pilot
        run: |
          set -euo pipefail
          python scripts/generate_quality_scorecard.py \
            --corpus examples/evaluation/qm2-labeling-pilot-v1/corpus.json \
            --predictions examples/evaluation/qm2-labeling-pilot-v1/predictions.json \
            --labels examples/evaluation/qm2-labeling-pilot-v1/labels-synthetic-v1.json \
            --output quality-scorecard.json \
            --json > quality-scorecard.stdout.json
          cmp quality-scorecard.json quality-scorecard.stdout.json
          python - <<'PY'
          import json

          scorecard = json.load(open("quality-scorecard.json", encoding="utf-8"))
          assert scorecard["data_state"]["state"] == "MISSING_DATA", scorecard["data_state"]
          assert scorecard["claims"]["accuracy"] is None
          assert scorecard["claims"]["quality_claim"] is False
          label_state = scorecard["data_state"]["label_state"]
          assert label_state["accepted_quality_method"] == "synthetic_model_teacher_adjudication"
          assert label_state["human_labels_required"] is False
          assert label_state["synthetic_is_human_truth"] is False
          assert label_state["arms"]["human"]["status"] == "missing"
          assert label_state["arms"]["synthetic"]["status"] == "partial"
          assert label_state["arms"]["synthetic"]["packets"] == 6
          assert label_state["arms"]["synthetic"]["complete_adjudicated_packets"] == 5
          for arm in ("harness", "droid"):
              summary = scorecard["arms"][arm]
              assert summary["status"] == "missing", summary["status"]
              assert summary["candidate_findings"] is None
              for kind in ("human", "synthetic"):
                  block = summary["label_arms"][kind]
                  assert block["status"] == "missing"
                  assert block["precision"]["lower_bound"]["value"] is None
                  assert block["recall"]["lower_bound"]["value"] is None
                  assert block["abstention"]["adjudicated_abstentions"] is None
                  assert block["duplicates"]["correlated_duplicates_excluded"] is None
                  assert block["unadjudicated"]["findings_without_final_adjudication"] is None
                  assert block["approve_with_known_defect"]["cases"] is None
          assert scorecard["completion"]["completed_of_expected"]["value"] is None
          print("scorecard: retained synthetic pilot reported MISSING_DATA with no predictions; synthetic label arm partial 6/5")
          PY
      - name: Prove missing/empty data does not fail the gate
        run: |
          set -euo pipefail
          python scripts/check_quality_scorecard_gate.py \
            --baseline quality-scorecard.json \
            --current quality-scorecard.json \
            --json > quality-scorecard-missing-gate.json
          python - <<'PY'
          import json

          gate = json.load(open("quality-scorecard-missing-gate.json", encoding="utf-8"))
          assert gate["status"] == "MISSING_DATA", gate
          assert gate["regressions"] == [], gate
          print("gate: empty data is MISSING_DATA, not failure or zero")
          PY
      - name: Gate the five-case accepted quality baseline
        run: |
          set -euo pipefail
          python scripts/generate_quality_scorecard.py \
            --corpus examples/evaluation/qm2-labeling-pilot-v1/corpus.json \
            --predictions examples/evaluation/qm2-baseline-scorecard-v1/predictions.json \
            --labels examples/evaluation/qm2-labeling-pilot-v1/labels-synthetic-v1.json \
            --output quality-scorecard-five-case.json --json > /dev/null
          python scripts/check_quality_scorecard_gate.py \
            --baseline examples/evaluation/qm2-baseline-scorecard-v1/accepted-baseline.json \
            --current quality-scorecard-five-case.json --json | tee quality-scorecard-five-case-gate.json
      - name: Prove the gate rejects a seeded injected regression
        run: |
          set -euo pipefail
          python scripts/generate_quality_scorecard.py \
            --corpus tests/fixtures/quality_scorecard/corpus.json \
            --predictions tests/fixtures/quality_scorecard/predictions-baseline.json \
            --labels tests/fixtures/quality_scorecard/labels.json \
            --output seeded-baseline-scorecard.json \
            --json > /dev/null
          python scripts/generate_quality_scorecard.py \
            --corpus tests/fixtures/quality_scorecard/corpus.json \
            --predictions tests/fixtures/quality_scorecard/predictions-regressed.json \
            --labels tests/fixtures/quality_scorecard/labels-regressed.json \
            --output seeded-regressed-scorecard.json \
            --json > /dev/null
          set +e
          python scripts/check_quality_scorecard_gate.py \
            --baseline seeded-baseline-scorecard.json \
            --current seeded-regressed-scorecard.json \
            --json > seeded-gate.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected seeded regression gate to exit 1, got $status"
            cat seeded-gate.json
            exit 1
          fi
          python - <<'PY'
          import json

          gate = json.load(open("seeded-gate.json", encoding="utf-8"))
          assert gate["status"] == "FAIL", gate
          assert "recall_lower_bound:harness:human" in gate["regressions"], gate
          assert "precision_lower_bound:harness:human" in gate["regressions"], gate
          assert "approve_with_known_defect:harness:human" in gate["regressions"], gate
          print("gate: seeded injected regression FAILS as expected")
          PY
      - name: Prove a synthetic-only scorecard is COMPLETE without human packets
        run: |
          set -euo pipefail
          python scripts/generate_quality_scorecard.py \
            --corpus tests/fixtures/quality_scorecard/corpus.json \
            --predictions tests/fixtures/quality_scorecard/predictions-baseline.json \
            --labels tests/fixtures/quality_scorecard/labels-synthetic.json \
            --output synthetic-only-scorecard.json \
            --json > /dev/null
          python scripts/check_quality_scorecard_gate.py \
            --baseline synthetic-only-scorecard.json \
            --current synthetic-only-scorecard.json \
            --json > synthetic-only-gate.json
          python - <<'PY'
          import json

          scorecard = json.load(open("synthetic-only-scorecard.json", encoding="utf-8"))
          assert scorecard["data_state"]["state"] == "COMPLETE", scorecard["data_state"]
          label_state = scorecard["data_state"]["label_state"]
          assert label_state["arms"]["human"]["status"] == "missing"
          assert label_state["arms"]["synthetic"]["status"] == "present"
          assert label_state["human_labels_required"] is False
          assert scorecard["claims"]["accuracy"] is None
          assert scorecard["claims"]["synthetic_is_human_truth"] is False
          harness = scorecard["arms"]["harness"]["label_arms"]
          assert harness["human"]["status"] == "missing_labels"
          assert harness["synthetic"]["status"] == "present"
          assert harness["synthetic"]["is_human_truth"] is False
          assert harness["synthetic"]["precision"]["lower_bound"]["value"] == 1.0
          assert harness["synthetic"]["recall"]["lower_bound"]["value"] == 1.0
          accuracy = scorecard["arms"]["harness"]["accuracy"]
          assert accuracy["status"] == "refused"
          assert "synthetic_is_not_human_accuracy" in accuracy["reasons"]
          gate = json.load(open("synthetic-only-gate.json", encoding="utf-8"))
          assert gate["status"] == "PASS", gate
          print("scorecard: synthetic-only arm COMPLETE, human arm optional and missing, no accuracy claim")
          PY
          python scripts/generate_quality_scorecard.py \
            --corpus tests/fixtures/quality_scorecard/corpus.json \
            --predictions tests/fixtures/quality_scorecard/predictions-regressed.json \
            --labels tests/fixtures/quality_scorecard/labels-synthetic.json \
            --output synthetic-regressed-scorecard.json \
            --json > /dev/null
          set +e
          python scripts/check_quality_scorecard_gate.py \
            --baseline synthetic-only-scorecard.json \
            --current synthetic-regressed-scorecard.json \
            --json > synthetic-regressed-gate.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected synthetic regression gate to exit 1, got $status"
            cat synthetic-regressed-gate.json
            exit 1
          fi
          python - <<'PY'
          import json

          gate = json.load(open("synthetic-regressed-gate.json", encoding="utf-8"))
          assert gate["status"] == "FAIL", gate
          assert "approve_with_known_defect:harness:synthetic" in gate["regressions"], gate
          print("gate: synthetic-only regression FAILS as expected")
          PY
      - name: Run focused scorecard and evaluation tests
        run: python -m pytest -q tests/test_quality_scorecard.py tests/test_evaluation.py tests/test_frozen_corpus.py
      - name: Retain the scorecard and gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-quality-scorecard-${{ github.run_id }}
          path: |
            quality-scorecard.json
            quality-scorecard.stdout.json
            synthetic-only-scorecard.json
            synthetic-only-gate.json
            synthetic-regressed-scorecard.json
            synthetic-regressed-gate.json
            quality-scorecard-missing-gate.json
            seeded-baseline-scorecard.json
            seeded-regressed-scorecard.json
            seeded-gate.json
          if-no-files-found: warn
          retention-days: 7

  frozen-pr464-prepare:
    name: Frozen PR-464 provider-free prepare integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the harness under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Check out the exact read-only SlopSearX source pair
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 2
        with:
          repository: magnus919/SlopSearX
          ref: bffc26f9e4bf95aca0c252e88a2396d03ece854c
          fetch-depth: 2
          path: slopsearx-source
          persist-credentials: false

      - name: Verify both immutable source revisions
        timeout-minutes: 1
        env:
          SOURCE_REPO: ${{ github.workspace }}/slopsearx-source
          EXPECTED_HEAD_SHA: bffc26f9e4bf95aca0c252e88a2396d03ece854c
          EXPECTED_BASE_SHA: 20a743f0434a1843aa00068483f608f1e213b2af
        run: |
          set -euo pipefail
          test "$(git -C "$SOURCE_REPO" rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C "$SOURCE_REPO" rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: '3.13'

      - name: Install harness test dependencies
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Rehearse frozen capture and source audit without provider dispatch
        timeout-minutes: 3
        env:
          PR464_SOURCE_REPO: ${{ github.workspace }}/slopsearx-source
          PR464_RUN_FULL_CAPTURE: '1'
        run: python -m pytest -q -s tests/test_frozen_pr464_source_audit_preflight.py tests/test_frozen_pr464_capture_integration.py

  build:
    name: Build wheel and source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the hash-locked development/test set
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - run: python -m build --no-isolation --wheel --sdist --outdir dist
      - name: Record distribution digests
        run: sha256sum dist/* | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  supply-chain:
    name: Supply chain (SBOM, unsigned provenance, reproducibility)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the hash-locked development/test set
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Build twice with SOURCE_DATE_EPOCH, generate evidence, and verify it
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          created="$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          package_name="$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['name'])")"
          version="$(python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          python scripts/check_reproducible_build.py \
            --source-date-epoch "$epoch" \
            --dist-out supply-chain-dist \
            --json-out reproducibility.json \
            --summary reproducibility.md \
            --created "$created"
          python scripts/generate_sbom.py \
            --dist supply-chain-dist \
            --output "supply-chain-dist/${package_name}-${version}.cdx.json" \
            --created "$created"
          python scripts/generate_provenance.py \
            --dist supply-chain-dist \
            --output supply-chain-dist/provenance.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_SHA" \
            --invocation-id "$GITHUB_RUN_ID" \
            --build-command "python scripts/check_reproducible_build.py --source-date-epoch ${epoch} --dist-out supply-chain-dist" \
            --created "$created" \
            --source-date-epoch "$epoch"
          (
            cd supply-chain-dist
            sha256sum ./*.whl ./*.tar.gz ./*.cdx.json ./provenance.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          python scripts/verify_release_artifacts.py \
            --dist supply-chain-dist \
            --sbom "supply-chain-dist/${package_name}-${version}.cdx.json" \
            --provenance supply-chain-dist/provenance.json \
            --checksums supply-chain-dist/SHA256SUMS \
            --source-revision "$GITHUB_SHA"
      - name: Run the supply-chain regression tests
        run: python -m pytest -q tests/test_supply_chain.py
      - name: Lint the supply-chain scripts and tests
        run: >-
          ruff check
          scripts/generate_sbom.py
          scripts/generate_provenance.py
          scripts/verify_release_artifacts.py
          scripts/check_reproducible_build.py
          tests/test_supply_chain.py
      - name: Retain the reproducibility and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-supply-chain-${{ github.run_id }}
          path: |
            reproducibility.json
            reproducibility.md
            supply-chain-dist/
          if-no-files-found: warn
          retention-days: 7

  installed-wheel:
    name: Installed wheel smoke (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: pr-review-distributions
          path: ${{ runner.temp }}/pr-review-dist
      - name: Install wheel in a fresh environment and smoke it outside the checkout
        env:
          WHEEL_ENV: ${{ runner.temp }}/pr-review-wheel
          DIST_DIR: ${{ runner.temp }}/pr-review-dist
        run: |
          set -euo pipefail
          python -m venv "$WHEEL_ENV"
          mapfile -t WHEELS < <(find "$DIST_DIR" -maxdepth 1 -type f -name '*.whl' -print)
          test "${#WHEELS[@]}" -eq 1
          "$WHEEL_ENV/bin/python" -m pip install --require-hashes --no-deps -r requirements-dev.lock
          "$WHEEL_ENV/bin/python" -m pip install --no-deps "${WHEELS[0]}"
          printf 'PR_REVIEW_PROTECTED_PUBLICATION_WHEEL=%s\n' "${WHEELS[0]}" >> "$GITHUB_ENV"
          "$WHEEL_ENV/bin/python" scripts/package_smoke.py --cli "$WHEEL_ENV/bin/pr-review"
      - name: Run protected publication safe-default tests against the built wheel
        env:
          WHEEL_ENV: ${{ runner.temp }}/pr-review-wheel
        run: |
          "$WHEEL_ENV/bin/python" -m pytest -q tests/test_protected_publication_installed.py
      - name: Run installed CLI recovery rehearsal with local fakes
        env:
          WHEEL_ENV: ${{ runner.temp }}/pr-review-wheel
          RECOVERY_OUTPUT_DIR: ${{ runner.temp }}/pr-review-recovery-${{ matrix.python-version }}
        run: >-
          "$WHEEL_ENV/bin/python" scripts/run_recovery_rehearsal.py
          --cli "$WHEEL_ENV/bin/pr-review"
          --output-dir "$RECOVERY_OUTPUT_DIR"
      - name: Retain bounded recovery rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-recovery-${{ github.run_id }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/pr-review-recovery-${{ matrix.python-version }}/recovery-rehearsal-summary.json
            ${{ runner.temp }}/pr-review-recovery-${{ matrix.python-version }}/artifacts/
          if-no-files-found: warn
          retention-days: 7

  install-matrix:
    name: Install matrix (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: pr-review-distributions
          path: ${{ runner.temp }}/install-matrix-dist
      - name: Install the wheel in a fresh environment and prove the documented contract
        shell: bash
        env:
          DIST_DIR: ${{ runner.temp }}/install-matrix-dist
          MATRIX_VENV: ${{ runner.temp }}/pr-review-install-matrix
        run: |
          set -euo pipefail
          # Git Bash/Windows: use forward slashes so both MSYS tools and the
          # native python.exe accept the runner paths.
          MATRIX_VENV="${MATRIX_VENV//\\//}"
          DIST_DIR="${DIST_DIR//\\//}"
          python -m venv "$MATRIX_VENV"
          if [ -d "$MATRIX_VENV/bin" ]; then BIN="$MATRIX_VENV/bin"; else BIN="$MATRIX_VENV/Scripts"; fi
          PYTHON="$BIN/python"
          if [ ! -x "$PYTHON" ]; then PYTHON="$BIN/python.exe"; fi
          WHEEL_COUNT="$(find "$DIST_DIR" -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')"
          test "$WHEEL_COUNT" -eq 1
          WHEEL="$(find "$DIST_DIR" -maxdepth 1 -type f -name '*.whl' | head -n 1)"
          test -n "$WHEEL"
          "$PYTHON" -m pip install --disable-pip-version-check "$WHEEL"
          "$PYTHON" - <<'PY'
          import importlib.metadata as metadata

          requires = metadata.requires("pr-review-harness") or []
          runtime = [item for item in requires if "extra ==" not in item]
          assert runtime == [], runtime
          assert metadata.metadata("pr-review-harness")["Requires-Python"] == ">=3.11"
          print("installed metadata: no runtime requirements; Requires-Python >=3.11")
          PY
          if [ -x "$BIN/pr-review" ]; then
            "$BIN/pr-review" --help
          else
            "$BIN/pr-review.exe" --help
          fi
          echo "pr-review --help: OK on ${{ matrix.os }} / Python ${{ matrix.python-version }}"

  transport-receipt-roundtrip:
    name: Installed loopback emitter and strict receipt validator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the Linux syscall observer
        timeout-minutes: 3
        run: |
          set -euo pipefail
          bash scripts/install_ci_strace.sh
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: pr-review-distributions
          path: ${{ runner.temp }}/transport-roundtrip-dist
      - name: Install the built wheel and test runner in an isolated environment
        env:
          ROUNDTRIP_ENV: ${{ runner.temp }}/transport-roundtrip-venv
          ROUNDTRIP_DIST: ${{ runner.temp }}/transport-roundtrip-dist
        run: |
          set -euo pipefail
          python -m venv "$ROUNDTRIP_ENV"
          "$ROUNDTRIP_ENV/bin/python" -m pip install --require-hashes --no-deps -r requirements-dev.lock
          "$ROUNDTRIP_ENV/bin/python" -m pip install --no-deps "$ROUNDTRIP_DIST"/*.whl
      - name: Run actual loopback emitter to strict validator roundtrip
        env:
          ROUNDTRIP_ENV: ${{ runner.temp }}/transport-roundtrip-venv
          RUN_INSTALLED_LOOPBACK_TRANSPORT_VALIDATOR_TEST: '1'
        run: |
          set -euo pipefail
          export PATH="$ROUNDTRIP_ENV/bin:$PATH"
          "$ROUNDTRIP_ENV/bin/python" -m pytest -q -s \
            tests/test_selected_control_transport_receipt.py::test_actual_installed_cli_transport_emitter_roundtrips_through_strict_validator
