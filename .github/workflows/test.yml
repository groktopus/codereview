name: Harness verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effect-observer:
    name: Linux external observer contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Require strace and record the exact observer runtime identity
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m pr_review_harness.external_effect_observer | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python -m pip install '.[dev]'
      - name: Measure bounded events for installed provider-free review preparation
        run: |
          set -euo pipefail
          python scripts/effect_observer_smoke.py | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python -m pytest -q -s tests/test_external_effect_observer.py
      - run: ruff check src/pr_review_harness/external_effect_observer.py tests/test_external_effect_observer.py

  tests:
    name: Tests and lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: ruff check .

  frozen-pr464-capture:
    name: Frozen PR-464 provider-free capture integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the harness under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 2
        with:
          persist-credentials: false

      - name: Check out the exact read-only SlopSearX source pair
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 2
        with:
          repository: magnus919/SlopSearX
          ref: bffc26f9e4bf95aca0c252e88a2396d03ece854c
          fetch-depth: 2
          path: slopsearx-source
          persist-credentials: false

      - name: Verify both immutable source revisions
        timeout-minutes: 1
        env:
          SOURCE_REPO: ${{ github.workspace }}/slopsearx-source
          EXPECTED_HEAD_SHA: bffc26f9e4bf95aca0c252e88a2396d03ece854c
          EXPECTED_BASE_SHA: 20a743f0434a1843aa00068483f608f1e213b2af
        run: |
          set -euo pipefail
          test "$(git -C "$SOURCE_REPO" rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git -C "$SOURCE_REPO" rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: '3.13'

      - name: Install harness test dependencies
        timeout-minutes: 3
        run: python -m pip install '.[dev]'

      - name: Run the frozen provider-free capture integration
        timeout-minutes: 3
        env:
          PR464_SOURCE_REPO: ${{ github.workspace }}/slopsearx-source
        run: python -m pytest -q -s tests/test_frozen_pr464_capture_integration.py

  build:
    name: Build wheel and source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: python -m build --wheel --sdist --outdir dist
      - name: Record distribution digests
        run: sha256sum dist/* | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  installed-wheel:
    name: Installed wheel smoke (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: pr-review-distributions
          path: ${{ runner.temp }}/pr-review-dist
      - name: Install wheel in a fresh environment and smoke it outside the checkout
        env:
          WHEEL_ENV: ${{ runner.temp }}/pr-review-wheel
          DIST_DIR: ${{ runner.temp }}/pr-review-dist
        run: |
          python -m venv "$WHEEL_ENV"
          "$WHEEL_ENV/bin/python" -m pip install "$DIST_DIR"/*.whl
          "$WHEEL_ENV/bin/python" scripts/package_smoke.py --cli "$WHEEL_ENV/bin/pr-review"
      - name: Run installed CLI recovery rehearsal with local fakes
        env:
          WHEEL_ENV: ${{ runner.temp }}/pr-review-wheel
          RECOVERY_OUTPUT_DIR: ${{ runner.temp }}/pr-review-recovery-${{ matrix.python-version }}
        run: >-
          "$WHEEL_ENV/bin/python" scripts/run_recovery_rehearsal.py
          --cli "$WHEEL_ENV/bin/pr-review"
          --output-dir "$RECOVERY_OUTPUT_DIR"
      - name: Retain bounded recovery rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-review-recovery-${{ github.run_id }}-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/pr-review-recovery-${{ matrix.python-version }}/recovery-rehearsal-summary.json
            ${{ runner.temp }}/pr-review-recovery-${{ matrix.python-version }}/artifacts/
          if-no-files-found: warn
          retention-days: 7

  transport-receipt-roundtrip:
    name: Installed loopback emitter and strict receipt validator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the Linux syscall observer
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes strace
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: pr-review-distributions
          path: ${{ runner.temp }}/transport-roundtrip-dist
      - name: Install the built wheel and test runner in an isolated environment
        env:
          ROUNDTRIP_ENV: ${{ runner.temp }}/transport-roundtrip-venv
          ROUNDTRIP_DIST: ${{ runner.temp }}/transport-roundtrip-dist
        run: |
          set -euo pipefail
          python -m venv "$ROUNDTRIP_ENV"
          "$ROUNDTRIP_ENV/bin/python" -m pip install "$ROUNDTRIP_DIST"/*.whl pytest
      - name: Run actual loopback emitter to strict validator roundtrip
        env:
          ROUNDTRIP_ENV: ${{ runner.temp }}/transport-roundtrip-venv
          RUN_INSTALLED_LOOPBACK_TRANSPORT_VALIDATOR_TEST: '1'
        run: |
          set -euo pipefail
          export PATH="$ROUNDTRIP_ENV/bin:$PATH"
          "$ROUNDTRIP_ENV/bin/python" -m pytest -q -s \
            tests/test_selected_control_transport_receipt.py::test_actual_installed_cli_transport_emitter_roundtrips_through_strict_validator
