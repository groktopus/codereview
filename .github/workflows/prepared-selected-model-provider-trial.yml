name: Prepared selected-pair clean-control provider trial

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepared-selected-model-provider-trial
  cancel-in-progress: false

jobs:
  trial:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'groktopus/codereview' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the trusted runner at a full immutable revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: groktopus/codereview
          ref: 896b9211ffaa1e888538d29184c23c76cb3c2863
          path: trusted-runner
          persist-credentials: false

      - name: Verify the exact trusted source revision before build or import
        env:
          EXPECTED_RUNNER_SHA: 896b9211ffaa1e888538d29184c23c76cb3c2863
          RUNNER_SOURCE: ${{ github.workspace }}/trusted-runner
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          expected = os.environ.get("EXPECTED_RUNNER_SHA", "")
          source = os.environ.get("RUNNER_SOURCE", "")
          if not re.fullmatch(r"[0-9a-f]{40}", expected) or not source:
              raise SystemExit("trusted_runner_identity_invalid")
          try:
              result = subprocess.run(
                  ["git", "-C", source, "rev-parse", "HEAD"],
                  check=False,
                  capture_output=True,
                  text=True,
                  timeout=10,
              )
          except (OSError, subprocess.TimeoutExpired):
              raise SystemExit("trusted_runner_revision_unavailable") from None
          if result.returncode or result.stdout.strip() != expected:
              raise SystemExit("trusted_runner_revision_mismatch")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Build the wheel from the verified trusted source
        working-directory: trusted-runner
        run: |
          mkdir -p "$RUNNER_TEMP/selected-model-wheelhouse"
          python -m pip wheel --no-deps \
            --wheel-dir "$RUNNER_TEMP/selected-model-wheelhouse" .

      - name: Install the verified wheel
        env:
          WHEELHOUSE: ${{ runner.temp }}/selected-model-wheelhouse
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          wheels = list(Path(os.environ["WHEELHOUSE"]).glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("trusted_runner_wheel_count_invalid")
          try:
              result = subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--no-deps", str(wheels[0])],
                  check=False,
                  timeout=180,
              )
          except (OSError, subprocess.TimeoutExpired):
              raise SystemExit("trusted_runner_install_failed") from None
          if result.returncode:
              raise SystemExit("trusted_runner_install_failed")
          PY

      - name: Preflight the bounded effect observer before provider configuration
        working-directory: trusted-runner
        env:
          EXPECTED_OBSERVER_SOURCE_SHA256: 1276e148dc32168512efdad8092d0cd734c841d127533c9b6bdb0d5bf50dd578
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pr_review_harness.external_effect_observer import OBSERVER_ID

          try:
              result = subprocess.run(
                  [sys.executable, "-m", "pr_review_harness.external_effect_observer"],
                  check=False,
                  capture_output=True,
                  text=True,
                  timeout=20,
              )
              identity = json.loads(result.stdout)
          except (OSError, subprocess.TimeoutExpired, json.JSONDecodeError):
              raise SystemExit("effect_observer_preflight_unavailable") from None
          report = {
              "status": identity.get("status"),
              "reason": identity.get("reason"),
              "observer_id": OBSERVER_ID,
              "source_sha256": identity.get("source_sha256"),
              "version": identity.get("version"),
              "executable_sha256": identity.get("executable_sha256"),
              "kill_on_exit_supported": identity.get("kill_on_exit_supported"),
          }
          print(json.dumps(report, sort_keys=True, separators=(",", ":")))
          if (
              result.returncode
              or identity.get("status") != "AVAILABLE"
              or OBSERVER_ID != "linux-strace-syscall-observer.v3"
              or identity.get("source_sha256") != os.environ.get("EXPECTED_OBSERVER_SOURCE_SHA256")
              or identity.get("kill_on_exit_supported") is not True
          ):
              raise SystemExit("effect_observer_preflight_rejected")
          PY

      - name: Prepare the three frozen cases without provider credentials
        working-directory: trusted-runner
        env:
          PREPARATION_OUTPUT: ${{ runner.temp }}/prepared-selected-model-provider-trial
        run: |
          set -euo pipefail
          python scripts/prepare_selected_pair_clean_control_trial.py \
            --output "$PREPARATION_OUTPUT" >/dev/null

      - name: Run the selected-pair trial with private temporary configs
        working-directory: trusted-runner
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
          JEV_MODEL: ${{ secrets.JEV_MODEL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          PREPARATION_OUTPUT: ${{ runner.temp }}/prepared-selected-model-provider-trial
        run: |
          set -euo pipefail
          private_config_dir="$RUNNER_TEMP/prepared-selected-model-provider-config"
          trial_output_dir="$RUNNER_TEMP/prepared-selected-model-provider-result"
          python scripts/provider_config_from_env.py \
            --output-dir "$private_config_dir" --json >/dev/null
          python scripts/run_selected_model_trial.py \
            --run-provider-trial \
            --prepared-plan "$PREPARATION_OUTPUT/selected-pair-clean-control-trial-v1.json" \
            --output "$trial_output_dir" \
            --cli-executable "$(command -v pr-review)" \
            --provider-config "$private_config_dir/provider.json" \
            --decision-config "$private_config_dir/decision.json" \
            --observe-effects >/dev/null

      - name: Remove only the private configs created for this run
        if: always()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          try:
              runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
              config_dir = runner_temp / "prepared-selected-model-provider-config"
              config_metadata = config_dir.lstat()
          except FileNotFoundError:
              config_metadata = None
          except OSError:
              raise SystemExit("provider_config_cleanup_failed") from None
          if config_metadata is not None:
              if stat.S_ISLNK(config_metadata.st_mode) or not stat.S_ISDIR(config_metadata.st_mode):
                  raise SystemExit("provider_config_cleanup_failed")
              for name in ("provider.json", "decision.json"):
                  path = config_dir / name
                  try:
                      metadata = path.lstat()
                  except FileNotFoundError:
                      continue
                  except OSError:
                      raise SystemExit("provider_config_cleanup_failed") from None
                  if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                      raise SystemExit("provider_config_cleanup_failed")
                  try:
                      path.unlink()
                  except OSError:
                      raise SystemExit("provider_config_cleanup_failed") from None
              try:
                  config_dir.rmdir()
              except OSError:
                  raise SystemExit("provider_config_cleanup_failed") from None
          preparation_dir = runner_temp / "prepared-selected-model-provider-trial"
          try:
              preparation_metadata = preparation_dir.lstat()
          except FileNotFoundError:
              preparation_metadata = None
          except OSError:
              raise SystemExit("preparation_cleanup_failed") from None
          if preparation_metadata is not None:
              if stat.S_ISLNK(preparation_metadata.st_mode) or not stat.S_ISDIR(preparation_metadata.st_mode):
                  raise SystemExit("preparation_cleanup_failed")
              try:
                  preparation_dir.resolve(strict=True).relative_to(runner_temp)
                  shutil.rmtree(preparation_dir)
              except (OSError, ValueError):
                  raise SystemExit("preparation_cleanup_failed") from None
          PY

      - name: Upload only the sanitized summary and manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-selected-model-provider-trial-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prepared-selected-model-provider-result/summary.json
            ${{ runner.temp }}/prepared-selected-model-provider-result/manifest.json
          if-no-files-found: warn
          retention-days: 7
