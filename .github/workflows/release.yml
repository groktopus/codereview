name: Release

# Build and publish a GitHub Release from an existing tag. This workflow never
# creates a tag: the tag push is the trigger, and workflow_dispatch accepts only
# an already-existing tag. It uses the repository-scoped GITHUB_TOKEN, reads no
# repository secrets, and does not publish to PyPI.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, for example v0.1.0. The workflow does not create tags.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the exact tag revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Verify the tag exists and matches the package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          # A missing tag fails here; nothing is built or published for it.
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          python3 scripts/check_version_policy.py \
            --tag "$RELEASE_TAG" \
            --notes-out release-notes.md | tee release-verification.log

      - name: Verify the tag commit is on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GH_REPO}/compare/${RELEASE_TAG}...${DEFAULT_BRANCH}" --jq '.status')"
          case "$status" in
            ahead|identical) ;;
            *)
              echo "release tag ${RELEASE_TAG} is not an ancestor of ${DEFAULT_BRANCH} (compare status ${status})" >&2
              exit 1
              ;;
          esac

      - name: Build wheel and source distribution
        run: |
          set -euo pipefail
          python -m pip install 'build>=1.2,<2'
          python -m build --wheel --sdist --outdir dist
          mv release-notes.md dist/RELEASE-NOTES.md

      - name: Record and verify SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Retain the verified distributions and notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only this job may create the release; the build job stays read-only.
      contents: write
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dist
          path: dist

      - name: Verify the downloaded checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Refuse to overwrite an existing release and require the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists for $RELEASE_TAG; refusing to overwrite" >&2
            exit 1
          fi
          # --verify-tag below also enforces this; probe first so the failure is
          # explicit and no release is attempted for a missing tag.
          gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null

      - name: Create the GitHub Release with artifacts and notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GH_REPO" \
            --title "pr-review-harness ${release_version}" \
            --notes-file dist/RELEASE-NOTES.md \
            --verify-tag

      - name: Record the created release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json tagName,url,assets | tee release.json
