# Separate from the existing strict boundary-stub gate in pyproject.toml.
# Every src implementation is passed explicitly by check_typing.py.
[mypy]
python_version = 3.11
platform = linux
strict = True
# Imported local experiments are outside this bounded implementation ratchet;
# their types are followed, but only explicit src/checker/test targets report errors.
follow_imports = silent
ignore_missing_imports = False
warn_unused_ignores = True
show_error_codes = True
show_column_numbers = True
error_summary = False
incremental = False
namespace_packages = True
explicit_package_bases = True
mypy_path = src, .
