# Copy to .github/workflows only after reviewing the pinned reusable workflow,
# target-repository policy, and secret exposure. This template is inert as saved.
name: Protected PR review analysis (disabled template)

on:
  pull_request_target:
    branches:
      - main # Replace with the target repository's protected base branch.
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: read

concurrency:
  group: protected-pr-review-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    # Deliberate hard stop. Remove only in a separately reviewed target-repo change.
    if: false
    uses: groktopus/codereview/.github/workflows/pr-analysis.yml@e5d1623ea69ae6b789c23c2c900acdb3913da3a7
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
    with:
      harness_repository: groktopus/codereview
      harness_sha: e5d1623ea69ae6b789c23c2c900acdb3913da3a7
      target_repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.pull_request.number }}
      base_ref: ${{ github.event.pull_request.base.ref }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      emit_publication_bundle: true
    secrets:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      JEV_BASE_URL: ${{ secrets.JEV_BASE_URL }}
      JEV_MODEL: ${{ secrets.JEV_MODEL }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
